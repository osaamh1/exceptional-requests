<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12306b">
<meta name="robots" content="noindex,nofollow">
<title>لوحة الطلبات الاستثنائية | كلية الشريعة</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{
  --navy:#12306b; --navy-2:#1d4690; --navy-soft:#e7edf8;
  --teal:#11908f; --teal-soft:#e2f3f2;
  --ink:#1c2431; --muted:#66707e; --line:#e1e6ee; --bg:#f4f6fa; --card:#fff;
  --ok:#1f7a55; --ok-soft:#e5f3ec; --warn:#a86a12; --warn-soft:#fbf1df;
  --bad:#b0412e; --bad-soft:#fbe9e5; --info:#2a5d8f; --info-soft:#e7eff8;
  --violet:#5b4bb5; --violet-soft:#eeebfb;
  --r:14px; --shadow:0 1px 2px rgba(18,48,107,.05),0 8px 24px rgba(18,48,107,.07);
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;color:var(--ink);background:var(--bg);font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:"Noto Kufi Arabic",sans-serif;line-height:1.5;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
.ltr{direction:ltr;unicode-bidi:isolate}

/* ---------- buttons / inputs ---------- */
.btn{border:0;border-radius:10px;padding:9px 16px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:.15s;font-size:14.5px;white-space:nowrap}
.btn svg{width:17px;height:17px;flex:none}
.btn.pri{background:var(--navy);color:#fff}.btn.pri:hover{background:var(--navy-2)}
.btn.teal{background:var(--teal);color:#fff}.btn.teal:hover{filter:brightness(1.07)}
.btn.ghost{background:#eef1f6;color:var(--ink)}.btn.ghost:hover{background:#e3e8f0}
.btn.line{background:#fff;border:1px solid var(--line);color:var(--ink)}.btn.line:hover{border-color:#c6cfdd}
.btn.warn{background:var(--warn-soft);color:var(--warn)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.input,.select,.textarea{width:100%;border:1.5px solid var(--line);background:#fafbfd;border-radius:10px;padding:9px 12px;outline:none;transition:.15s;font-size:15px}
.input:focus,.select:focus,.textarea:focus{border-color:var(--navy-2);background:#fff;box-shadow:0 0 0 4px var(--navy-soft)}
.textarea{resize:vertical;min-height:84px;line-height:1.8}
label.l{display:block;font-weight:600;font-size:13.5px;margin:0 0 5px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.picks{display:flex;flex-wrap:wrap;gap:7px}
.pick{border:1.5px solid #d3dbe8;background:#fff;border-radius:999px;padding:5px 13px;font-size:13px;cursor:pointer;color:var(--ink);font-weight:500;transition:.12s}
.pick:hover{border-color:var(--navy-2)}
.pick.on{background:var(--navy);border-color:var(--navy);color:#fff}
.pick.on::before{content:"✓ "}
.pick.closing{border-style:dashed}
.pick .lnk{font-weight:700;white-space:nowrap}
.pick.closing.on{background:var(--teal);border-color:var(--teal);border-style:solid}
.chip{border:1px dashed #c7d0de;background:#fff;border-radius:999px;padding:3px 11px;font-size:12.5px;cursor:pointer;color:var(--navy-2)}
.chip:hover{background:var(--navy-soft);border-style:solid}

/* ---------- login ---------- */
.login{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:linear-gradient(160deg,var(--navy) 0%,#0c2350 60%,#0a1c40 100%)}
.login .box{background:#fff;border-radius:20px;padding:30px 26px;width:100%;max-width:400px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.login img{width:220px;display:block;margin:0 auto 6px}
.login h1{font-size:19px;text-align:center;color:var(--navy);margin:6px 0 2px}
.login p.sub{text-align:center;color:var(--muted);margin:0 0 20px;font-size:13.5px}
.login .f{margin-bottom:12px}
.login .btn{width:100%;padding:11px}
.login .link{display:block;text-align:center;margin-top:12px;color:var(--navy-2);font-size:13.5px;cursor:pointer;background:none;border:0}
.login .msg{font-size:13.5px;border-radius:10px;padding:9px 12px;margin-bottom:12px}
.login .msg.err{background:var(--bad-soft);color:var(--bad)}
.login .msg.ok{background:var(--ok-soft);color:var(--ok)}

/* ---------- shell ---------- */
.top{background:var(--navy);color:#fff;position:sticky;top:0;z-index:20;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.top::after{content:"";display:block;height:3px;background:linear-gradient(90deg,transparent,var(--teal),transparent)}
.top .in{max-width:1320px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px}
.top img{height:40px}
.top .ttl{font-family:"Noto Kufi Arabic";font-weight:700;font-size:15px;border-inline-start:1px solid rgba(255,255,255,.25);padding-inline-start:14px}
.top .sp{flex:1}
.who{display:flex;align-items:center;gap:10px;font-size:13.5px}
.who .role{background:rgba(255,255,255,.14);border-radius:999px;padding:2px 10px;font-size:12px}
.who .deleg{background:var(--teal);border-radius:999px;padding:2px 10px;font-size:12px}
.ibtn{background:rgba(255,255,255,.1);border:0;color:#fff;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;cursor:pointer}
.ibtn:hover{background:rgba(255,255,255,.2)}
.ibtn svg{width:18px;height:18px}
@media (max-width:720px){.top .ttl,.who .nm{display:none}.top img{height:34px}}

main.app{max-width:1320px;margin:0 auto;padding:18px 16px 40px}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:16px}
@media (max-width:1000px){.kpis{grid-template-columns:repeat(3,1fr)}}
@media (max-width:520px){.kpis{grid-template-columns:repeat(3,1fr);gap:6px}.kpi{padding:8px 9px}.kpi b{font-size:20px}.kpi span{font-size:11px;line-height:1.35;display:block}}
.kpi{background:#fff;border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow);border:1px solid rgba(0,0,0,.02);cursor:pointer;text-align:right;border-inline-start:4px solid var(--c,var(--navy));transition:.15s}
.kpi:hover{transform:translateY(-1px)}
.kpi.on{outline:2px solid var(--c,var(--navy));outline-offset:-2px}
.kpi b{display:block;font-size:26px;line-height:1.2;font-family:"IBM Plex Sans Arabic";color:var(--c,var(--navy))}
.kpi span{font-size:12.5px;color:var(--muted);font-weight:600}

/* toolbar */
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.tabs{display:flex;background:#fff;border-radius:12px;padding:4px;box-shadow:var(--shadow);gap:2px;overflow-x:auto;max-width:100%}
.tab{border:0;background:none;padding:7px 13px;border-radius:9px;cursor:pointer;font-weight:600;color:var(--muted);white-space:nowrap;font-size:14px}
.tab .n{display:inline-block;min-width:20px;padding:0 6px;border-radius:999px;background:#eef1f6;color:var(--muted);font-size:11.5px;margin-inline-start:4px}
.tab.on{background:var(--navy);color:#fff}.tab.on .n{background:rgba(255,255,255,.2);color:#fff}
.search{flex:1;min-width:200px;position:relative}
.search input{padding-inline-start:36px}
.search svg{position:absolute;right:11px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--muted)}

/* list */
.layout{display:grid;grid-template-columns:minmax(330px,420px) 1fr;gap:16px;align-items:start}
@media (max-width:980px){.layout{grid-template-columns:1fr}}
.list{display:flex;flex-direction:column;gap:8px}
.item{background:#fff;border-radius:12px;padding:12px 14px;box-shadow:var(--shadow);cursor:pointer;border:1.5px solid transparent;transition:.12s;display:grid;grid-template-columns:1fr auto;gap:2px 10px}
.item:hover{border-color:#d3dbe8}
.item.on{border-color:var(--navy)}
.item .nm{font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .rf{font-size:12.5px;color:var(--muted);font-weight:600}
.item .sm{grid-column:1/-1;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .mt{grid-column:1/-1;display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:4px;font-size:12px;color:var(--muted)}
.late{color:var(--bad);font-weight:700}
.empty{text-align:center;color:var(--muted);padding:40px 16px;background:#fff;border-radius:var(--r);box-shadow:var(--shadow)}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-weight:700;font-size:12px;white-space:nowrap}
.t-new{background:var(--info-soft);color:var(--info)}
.t-in_review{background:var(--navy-soft);color:var(--navy-2)}
.t-needs_info{background:var(--warn-soft);color:var(--warn)}
.t-at_dean{background:var(--violet-soft);color:var(--violet)}
.t-referred,.t-approved{background:var(--ok-soft);color:var(--ok)}
.t-rejected{background:var(--bad-soft);color:var(--bad)}
.t-reserved{background:var(--warn-soft);color:var(--warn)}
/* حالات التوجيه: ممتلئة بلون القرار مع رمز، لتتميّز عن زر «استلام الطلب» */
.pill.dec{color:#fff;border-radius:7px;padding:2px 9px;display:inline-flex;align-items:center;gap:4px}
.pill.dec::before{font-weight:900}
.pill.dec-approved{background:#1f8a57}.pill.dec-approved::before{content:"✓"}
.pill.dec-rejected{background:#b8432f}.pill.dec-rejected::before{content:"✕"}
.pill.dec-reserved{background:#c07a12}.pill.dec-reserved::before{content:"!"}
.t-closed,.t-withdrawn{background:#eceff3;color:var(--muted)}
.btn.take{background:#1f9d63;color:#fff;box-shadow:0 2px 8px rgba(31,157,99,.25)}
.btn.take:hover{background:#178553}
.take-row{grid-column:1/-1;display:flex;justify-content:flex-end;border-top:1px dashed var(--line);margin-top:9px;padding-top:9px}
.take-card{display:inline-flex;align-items:center;gap:5px;border:1px solid #9fd8b9;background:#ecf8f1;color:#17663f;border-radius:999px;padding:4px 14px 4px 12px;font-weight:700;font-size:12.5px;cursor:pointer;transition:.15s}
.take-card svg{width:14px;height:14px}
.take-card:hover{background:#1f9d63;border-color:#1f9d63;color:#fff;box-shadow:0 2px 8px rgba(31,157,99,.25)}
.take-card:disabled{opacity:.6;cursor:wait}
.atdean{background:var(--violet-soft);color:#4a3d99;border-radius:12px;padding:10px 14px;margin-top:14px;font-size:13.5px}
.recv{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:#e9f7ef;border:1px solid #bfe5cf;border-radius:12px;padding:12px 14px;margin-top:14px}
.recv div{flex:1;min-width:200px}
.recv b{display:block;color:#17663f}
.recv span{font-size:13px;color:#3c6b53}
.note-link{margin-inline-start:auto;background:none;border:1px dashed #c7d0de;border-radius:999px;padding:2px 10px;font-size:12px;color:var(--navy-2);cursor:pointer;font-family:"IBM Plex Sans Arabic",sans-serif;font-weight:600}
.note-link:hover{background:var(--navy-soft)}
.dsum{grid-column:1/-1;margin-top:8px;border-radius:9px;padding:7px 10px;font-size:12.5px;border-inline-start:3px solid;background:#f6f8fb;line-height:1.7}
.dsum .dl{color:var(--ink)}
.dsum .dl b{font-weight:700}
.dsum .dn{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dsum .dm{display:flex;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:11.5px;margin-top:2px}
.dsum .dm .wait{color:var(--teal);font-weight:700}
.ds-approved{border-color:#1f8a57;background:#f0f8f3}
.ds-rejected{border-color:#b8432f;background:#fcf2f0}
.ds-reserved{border-color:#c07a12;background:#fdf6ea}
.ds-withdrawn{border-color:#9aa3b2}
.tag.rep{background:var(--warn-soft);color:var(--warn);font-weight:700}
.box.reply{background:#fffaf0;border:1px solid #efd7ad}
.file .stg{display:block;background:var(--warn-soft);color:var(--warn);font-size:10.5px;text-align:center;font-weight:700}
.tag{background:#f0f2f6;border-radius:6px;padding:1px 7px}

/* detail */
.detail{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);position:sticky;top:78px;max-height:calc(100vh - 96px);display:flex;flex-direction:column;overflow:hidden}
.d-head{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.d-head .rf{font-size:20px;font-weight:700;color:var(--navy)}
.d-head .sp{flex:1}
.d-close{display:none}
.d-body{padding:4px 18px 18px;overflow:auto;flex:1}
.d-actions{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;background:#fbfcfe}
@media (max-width:980px){
  .detail{position:fixed;inset:0;top:0;max-height:none;border-radius:0;z-index:40}
  .d-close{display:grid}
}
.sec{padding:14px 0;border-bottom:1px dashed var(--line)}
.sec:last-child{border:0}
.sec h3{font-size:13.5px;color:var(--navy);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px 16px}
@media (max-width:520px){.kv{grid-template-columns:1fr 1fr}.d-actions{padding:10px 12px;gap:6px}.d-actions .btn{flex:1 1 45%;padding:8px 10px;font-size:13.5px}}
.kv div small{display:block;color:var(--muted);font-size:12px}
.kv div b{font-weight:600}
.txt{white-space:pre-wrap;word-break:break-word;background:#f8f9fc;border-radius:10px;padding:10px 12px;font-size:14.5px}
.txt+.txt{margin-top:8px}
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.file{border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;background:#fafbfd;text-decoration:none;color:inherit}
.file .th{height:86px;display:grid;place-items:center;background:#eef1f6;color:var(--navy-2);font-weight:700;font-size:13px;overflow:hidden}
.file .th img{width:100%;height:100%;object-fit:cover}
.file .fn{padding:5px 8px;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:ltr;text-align:right}
.box{border-radius:12px;padding:12px 14px;font-size:14.5px}
.box.office{background:var(--navy-soft);white-space:pre-wrap}
.box.dean{background:var(--teal-soft);border-inline-start:4px solid var(--teal)}
.box.dean .dc{font-weight:800;font-size:16px}
.box.stu{background:var(--warn-soft)}
.box small{display:block;color:var(--muted);font-size:12px;margin-top:4px}

/* directive composer */
.direct{border:2px solid var(--teal);border-radius:14px;padding:14px;background:linear-gradient(180deg,#fff,var(--teal-soft))}
.direct h3{color:#0b6e6d}
.dec{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.dec button{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:10px 6px;font-weight:700;cursor:pointer;font-size:15px}
.dec button[data-v=approved].on{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.dec button[data-v=rejected].on{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.dec button[data-v=reserved].on{border-color:var(--warn);background:var(--warn-soft);color:var(--warn)}
.direct .row2{display:grid;grid-template-columns:1fr;gap:10px}

/* timeline */
.tl{list-style:none;margin:0;padding:0;position:relative}
.tl::before{content:"";position:absolute;right:6px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl li{position:relative;padding:0 24px 12px 0;font-size:13.5px}
.tl li::before{content:"";position:absolute;right:1px;top:6px;width:12px;height:12px;border-radius:50%;background:#fff;border:2.5px solid var(--navy-2)}
.tl li.n::before{border-color:#b9c3d3}
.tl small{color:var(--muted);font-size:12px}
.tl q{display:block;quotes:none;background:#f8f9fc;border-radius:8px;padding:5px 9px;margin-top:3px;font-size:13px;white-space:pre-wrap}

/* modal */
.mod{position:fixed;inset:0;background:rgba(10,24,52,.5);backdrop-filter:blur(2px);display:none;place-items:center;z-index:60;padding:16px}
.mod.on{display:grid}
.mod .mb{background:#fff;border-radius:16px;width:100%;max-width:520px;max-height:calc(100vh - 32px);overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.mod .mh{padding:16px 18px;border-bottom:1px solid var(--line);font-family:"Noto Kufi Arabic";font-weight:700;color:var(--navy)}
.mod .mc{padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.mod .mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-start}
.mod .hint{font-size:12.5px;color:var(--muted)}

/* settings table */
.ut{width:100%;border-collapse:collapse;font-size:13.5px}
.ut td,.ut th{padding:7px 6px;border-bottom:1px solid var(--line);text-align:right}
.ut th{color:var(--muted);font-weight:600;font-size:12.5px}

.toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,30px);opacity:0;background:var(--ink);color:#fff;padding:10px 18px;border-radius:12px;font-size:14px;transition:.3s;z-index:80;max-width:calc(100% - 32px);text-align:center;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast.error{background:var(--bad)}.toast.ok{background:var(--ok)}
.spin{width:30px;height:30px;border-radius:50%;border:3px solid var(--navy-soft);border-top-color:var(--navy);margin:0 auto 8px;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* ================= PRINT: official form ================= */
#print{display:none}
@media print{
  /* margin:0 removes the browser's own header/footer (date, page title, address, page number) */
  @page{size:A4;margin:0}
  body{background:#fff}
  body>*:not(#print){display:none!important}
  #print{display:block;padding:10mm 14mm 8mm}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
/* ---- one font family (the title's font) with a clear size scale ----
   title 18pt · directive decision 15pt · section headings 11.5pt · body 11pt · labels 10.5pt · footnote 8.5pt */
.pf,.pf *{font-family:"Noto Kufi Arabic","IBM Plex Sans Arabic",sans-serif}
.pf{color:#1a1f2b;line-height:1.7;font-size:11pt;font-weight:400}
.pf .ph{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;border-bottom:2px solid var(--navy);padding-bottom:12px}
.pf .ph img{height:58px}
.pf .ph .t{text-align:center}
.pf .ph .t h1{font-size:17pt;font-weight:800;color:var(--navy);line-height:1.5}
.pf .ph .t div{font-size:10pt;color:#5b6475;font-weight:500}
.pf .ph .meta{font-size:8.5pt;text-align:left;line-height:1.8;justify-self:end;align-self:start;padding-top:4px}
.pf .ph .meta div{white-space:nowrap;color:#5b6475}
.pf .ph .meta b{color:#1a1f2b;font-weight:700}
.pf .acc{height:3px;background:linear-gradient(90deg,transparent,var(--teal),transparent);margin:2px 0 20px}
.pf .salute{font-size:12pt;font-weight:600;margin:0 0 10px;line-height:2.15}
.pf .salute .hz{display:flex;justify-content:space-between}
.pf .intro{margin:0 0 6px;font-size:11.5pt;font-weight:500;line-height:2}
.pf .intro b{font-weight:700}
.pf .sec-t{font-size:12pt;font-weight:800;color:var(--navy);margin:18px 0 8px;padding-bottom:4px;border-bottom:1.5px solid #dfe5ee}
.pf table{width:100%;border-collapse:collapse;margin:0 0 8px;font-size:10.5pt}
.pf th,.pf td{border:1px solid #c9d1de;padding:5px 10px;text-align:center;vertical-align:middle}
.pf th{background:#eef2f8;color:var(--navy);width:1%;white-space:nowrap;font-weight:700}
.pf td{font-weight:500}
.pf .blk{margin:10px 0}
.pf .blk h4{margin:0 0 5px;color:var(--navy);font-size:11.5pt;font-weight:700}
.pf .blk div{white-space:pre-wrap;border:1px solid #dfe5ee;border-radius:6px;padding:6px 12px;background:#fbfcfe;font-size:11pt}

<body>

<!-- ================= LOGIN ================= -->
<section class="login" id="vLogin" hidden>

    <img src="assets/logo.png" alt="جامعة القصيم — كلية الشريعة">

    <button class="ibtn" id="btnPass" title="تغيير كلمة المرور"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></button>

<script>
/* =====================================================================
   الإعدادات
   ===================================================================== */
const CONFIG = {
  SUPABASE_URL: 'https://nwdmnjpzkkqtksetrelk.supabase.co',
  SUPABASE_ANON_KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im53ZG1uanB6a2txdGtzZXRyZWxrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzOTc2MjMsImV4cCI6MjEwNzk3MzYyM30.3JE8h1Vv-DOeLHuBensYYibx-TAj8o_-21KWh2MPivc',
  BUCKET: 'request-files',
  IDLE_MINUTES: 30,        // خروج تلقائي بعد عدم النشاط
  LATE_DAYS: 2,            // يُعلَّم الطلب متأخراً إذا بقي بلا حركة أكثر من هذا
  AUTO_REFRESH_SEC: 60,
};

const ROLES = { admin:'مدير النظام', office:'مكتب الكلية', dean:'عميد الكلية', referral:'جهة إحالة' };
const STATUS = {
  new:{l:'جديد'}, in_review:{l:'قيد المراجعة'}, needs_info:{l:'بانتظار استكمال'}, at_dean:{l:'لدى العميد'},
  referred:{l:'محال'}, approved:{l:'موافق'}, rejected:{l:'غير موافق'}, reserved:{l:'متحفظ'}, closed:{l:'مغلق'}, withdrawn:{l:'مسحوب'},
};
const DECISION = { approved:'موافق', rejected:'غير موافق', reserved:'متحفظ' };
const CATEGORY = { registration:'تسجيل المقررات', exams:'الاختبارات', postpone:'اعتذار وتأجيل', plan:'الخطة والمعادلة', other:'أخرى' };
const BYPASS = { deadline:'انتهاء المدة المحددة', unavailable:'الطلب غير متاح في النظام', technical:'تعذّر تقني', other:'سبب آخر' };
const LEVEL = { bachelor:'بكالوريوس', master:'ماجستير', phd:'دكتوراه' };
const GENDER = { male:'طالب', female:'طالبة' };
const REFERRALS = [
  'وكيل الكلية للشؤون الطلابية','وكيل الكلية للشؤون التعليمية',
  'قسم القرآن وعلومه','قسم الفقه','قسم أصول الفقه','قسم العقيدة','قسم السنة','قسم القانون',
];
const STUDENT_TRACK_URL = 'https://osaamh1.github.io/exceptional-requests/#track';
const PHRASES = {
  approved: ['لا مانع وفق الأنظمة واللوائح','لا مانع، مع استكمال الإجراءات النظامية','لا مانع استثناءً، ولمرة واحدة','للتنفيذ وفق الأنظمة'],
  rejected: ['يُعتذر لعدم استيفاء الشروط النظامية','يُعتذر لانتهاء المدة النظامية','لا يُوافق لعدم كفاية المبررات'],
  reserved: ['للدراسة والإفادة بالمرئيات','يُعرض على مجلس القسم','يُستكمل ما يثبت العذر','للاطلاع والإفادة'],
  forward:  ['المرفقات مكتملة','الطالب لديه عذر موثق','الطلب بعد انتهاء المدة بأيام قليلة','سبق للطالب طلب مماثل','يتطلب رأي القسم المختص'],
  forwardClosing: 'لإطلاعكم وتوجيهكم',
  info:     ['يرجى إرفاق ما يثبت العذر','يرجى توضيح المقرر المطلوب ورمزه والشعبة','يرجى مراجعة مكتب الكلية لاستكمال الطلب'],
  close:    { approved:'تمت الموافقة على طلبك، وأُحيل إلى الجهة المختصة لاستكمال الإجراء.',
              rejected:'نعتذر، لم تتم الموافقة على طلبك.',
              reserved:'صدر توجيه بشأن طلبك، يرجى الاستعلام عن الطلب في المنصة: ' + STUDENT_TRACK_URL },
};
const EVENT = {
  submitted:'قدّم الطالب الطلب', take:'استلمه المكتب للمراجعة', info_request:'طُلب من الطالب استكمال الطلب',
  forward:'رُفع إلى العميد', decision:'صدر توجيه العميد', return:'أعاده العميد إلى المكتب',
  close:'أُقفل الطلب', enjaz:'سُجّل رقم معاملة إنجاز', student_message:'حُدّثت الرسالة الظاهرة للطالب',
  note:'ملاحظة داخلية', reopen:'أُعيد فتح الطلب', status:'تغيّرت الحالة',
  completed:'استكمل الطالب الطلب', withdrawn:'سحب الطالب الطلب',
};
const OPEN = ['new','in_review','needs_info','at_dean','referred'];

/* ---------------- helpers ---------------- */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hijri = (iso, opts={day:'numeric',month:'long',year:'numeric'}) => {
  try { return new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura-nu-latn', opts).format(new Date(iso)); } catch { return new Date(iso).toLocaleDateString(); }
};
const time = iso => { try { return new Intl.DateTimeFormat('ar-SA-u-nu-latn',{hour:'numeric',minute:'2-digit'}).format(new Date(iso)); } catch { return ''; } };
const ago = iso => {
  const m = Math.round((Date.now() - new Date(iso)) / 60000);
  if (m < 1) return 'الآن'; if (m < 60) return `قبل ${m} د`;
  const h = Math.round(m/60); if (h < 24) return `قبل ${h} س`;
  const d = Math.round(h/24); return d === 1 ? 'أمس' : d === 2 ? 'قبل يومين' : d <= 10 ? `قبل ${d} أيام` : `قبل ${d} يوماً`;
};
let toastT;
function toast(msg, type=''){ const t=$('#toast'); t.textContent=msg; t.className=`toast on ${type}`; clearTimeout(toastT); toastT=setTimeout(()=>t.className='toast',3400); }
function errText(e){
  const m = String(e?.message || e || '');
  if (m.includes('FORBIDDEN')) return 'لا تملك صلاحية هذا الإجراء.';
  if (m.includes('BAD_STATE')) return 'حالة الطلب تغيّرت، حدّث الصفحة وحاول مجدداً.';
  if (m.includes('MESSAGE_REQUIRED')) return 'اكتب النص المطلوب.';
  if (/Invalid login/i.test(m)) return 'البريد أو كلمة المرور غير صحيحة.';
  if (/fetch|network/i.test(m)) return 'تعذّر الاتصال. تحقق من الإنترنت.';
  return 'حدث خطأ: ' + m;
}

const sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY, { auth:{ persistSession:true, autoRefreshToken:true } });

/* ---------------- state ---------------- */
const S = { me:null, canDirect:false, settings:{}, people:{}, rows:[], tab:null, kpi:null, q:'', sel:null, cache:{} };

/* ================= AUTH ================= */
function show(view){ ['vLogin','vReset','vApp'].forEach(v => $('#'+v).hidden = v!==view); }
function lMsg(t, kind='err'){ const m=$('#lMsg'); m.hidden=!t; m.textContent=t||''; m.className='msg '+kind; }

$('#lForm').addEventListener('submit', async e => {
  e.preventDefault();
  const email = $('#lEmail').value.trim(), password = $('#lPass').value;
  if (!email || !password) return lMsg('أدخل البريد وكلمة المرور.');
  $('#lBtn').disabled = true; lMsg('');
  const { error } = await sb.auth.signInWithPassword({ email, password });
  $('#lBtn').disabled = false;
  if (error) return lMsg(errText(error));
  boot();
});
$('#lForgot').addEventListener('click', async () => {
  const email = $('#lEmail').value.trim();
  if (!email) return lMsg('اكتب بريدك أولاً ثم اضغط «نسيت كلمة المرور».');
  const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
  lMsg(error ? errText(error) : 'إذا كان البريد مسجلاً فستصلك رسالة بها رابط تعيين كلمة المرور.', error ? 'err' : 'ok');
});
$('#rBtn').addEventListener('click', async () => {
  const p = $('#rPass').value;
  const m = $('#rMsg');
  if (p.length < 8) { m.hidden=false; m.className='msg err'; m.textContent='كلمة المرور قصيرة.'; return; }
  const { error } = await sb.auth.updateUser({ password: p });
  m.hidden=false; m.className = 'msg ' + (error ? 'err' : 'ok'); m.textContent = error ? errText(error) : 'تم الحفظ ✓';
  if (!error) { history.replaceState(null,'',location.pathname); setTimeout(boot, 800); }
});
$('#btnLogout').addEventListener('click', async () => { await sb.auth.signOut(); location.reload(); });

sb.auth.onAuthStateChange((ev) => { if (ev === 'PASSWORD_RECOVERY') show('vReset'); });

/* inactivity logout */
let idleT;
function bumpIdle(){ clearTimeout(idleT); idleT = setTimeout(async () => { if (S.me) { await sb.auth.signOut(); alert('تم تسجيل الخروج تلقائياً لعدم النشاط.'); location.reload(); } }, CONFIG.IDLE_MINUTES*60000); }
['click','keydown','mousemove','touchstart','scroll'].forEach(ev => addEventListener(ev, bumpIdle, {passive:true}));

/* ================= BOOT ================= */
async function boot(){
  if (/type=recovery/.test(location.hash)) { show('vReset'); return; }
  const { data:{ session } } = await sb.auth.getSession();
  if (!session) { show('vLogin'); return; }
  const { data: me, error } = await sb.from('profiles').select('*').eq('id', session.user.id).maybeSingle();
  if (error || !me || !me.active) {
    await sb.auth.signOut(); show('vLogin');
    lMsg('هذا الحساب غير مفعّل في المنصة. تواصل مع مدير النظام.'); return;
  }
  S.me = me;
  const [{ data: cd }, { data: st }, { data: ppl }] = await Promise.all([
    sb.rpc('can_direct'), sb.from('settings').select('*').eq('id',1).maybeSingle(), sb.from('profiles').select('id,full_name,role,title,active,delegate_until,email'),
  ]);
  S.canDirect = !!cd; S.settings = st || {};
  S.people = Object.fromEntries((ppl||[]).map(p => [p.id, p]));
  $('#meName').textContent = me.full_name;
  $('#meRole').textContent = ROLES[me.role] || me.role;
  $('#meDeleg').hidden = !(S.canDirect && me.role !== 'dean');
  $('#btnSettings').hidden = !['admin','dean'].includes(me.role);
  show('vApp'); bumpIdle();
  buildTabs();
  await load();
  setInterval(() => { if (!document.hidden && !$('#mod').classList.contains('on')) load(true); }, CONFIG.AUTO_REFRESH_SEC*1000);
}

/* ================= DATA ================= */
async function load(silent){
  if (!silent) $('#list').innerHTML = '<div class="empty"><div class="spin"></div>جاري التحميل…</div>';
  const { data, error } = await sb.from('requests')
    .select('id,ref_no,student_name,university_id,student_email,gender,level,department,college,mobile,category,summary,bypass_reason,bypass_other,justification,status,office_note,dean_decision,dean_note,referred_to,student_message,enjaz_no,assigned_to,forwarded_at,decided_at,decided_by,decided_on_behalf,closed_at,student_replied_at,created_at,updated_at')
    .order('created_at', { ascending:false }).limit(1000);
  if (error) { $('#list').innerHTML = `<div class="empty">${esc(errText(error))}</div>`; return; }
  S.rows = data || [];
  renderKpis(); renderTabs(); renderList();
  if (S.sel) { const r = S.rows.find(x => x.id === S.sel); if (r) renderDetail(r, silent); }
}
const canTake = r => r.status==='new' && ['admin','office'].includes(S.me?.role);
const TAKE_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
const deptText = r => r.college ? `${r.department} — ${r.college}` : r.department;
const isLate = r => OPEN.includes(r.status) && r.status !== 'referred' && (Date.now() - new Date(r.updated_at)) > CONFIG.LATE_DAYS*864e5;
const replied = r => r.status==='in_review' && r.student_replied_at && (!r.forwarded_at || new Date(r.student_replied_at) > new Date(r.forwarded_at));
const decidedNotClosed = r => ['approved','rejected','reserved','referred'].includes(r.status);

/* ================= KPIs / TABS ================= */
const KPIS = [
  { id:'new',      l:'جديدة',               c:'var(--info)',   f:r => r.status==='new' },
  { id:'review',   l:'قيد المراجعة', c:'var(--navy-2)', f:r => ['in_review','needs_info'].includes(r.status) },
  { id:'dean',     l:'لدى العميد',          c:'var(--violet)', f:r => r.status==='at_dean' },
  { id:'toclose',  l:'بانتظار الإقفال', c:'var(--teal)', f:decidedNotClosed },
  { id:'late',     l:'متأخرة',              c:'var(--bad)',    f:isLate },
  { id:'month',    l:'أُقفلت هذا الشهر',      c:'var(--ok)',     f:r => r.status==='closed' && r.closed_at && hijri(r.closed_at,{month:'numeric',year:'numeric'})===hijri(new Date(),{month:'numeric',year:'numeric'}) },
];
function renderKpis(){
  $('#kpis').innerHTML = KPIS.map(k => `<button class="kpi ${S.kpi===k.id?'on':''}" style="--c:${k.c}" data-k="${k.id}"><b>${S.rows.filter(k.f).length}</b><span>${k.l}</span></button>`).join('');
}
$('#kpis').addEventListener('click', e => {
  const b = e.target.closest('[data-k]'); if (!b) return;
  S.kpi = S.kpi === b.dataset.k ? null : b.dataset.k; renderKpis(); renderList(); closeIfHidden();
});

let TABS = [];
function buildTabs(){
  // كل طلب في تبويب واحد فقط بحسب «ما المطلوب مني؟»، مع «الكل» للعرض الشامل
  TABS = S.me.role === 'dean' ? [
    { id:'action', l:'بانتظار توجيهك',     f:r => r.status==='at_dean' },
    { id:'done',   l:'التوجيهات الصادرة', f:r => !!r.dean_decision },
    { id:'all',    l:'الكل',               f:() => true },
  ] : [
    { id:'action', l:'تحتاج إجراء', f:r => ['new','in_review','needs_info'].includes(r.status) || decidedNotClosed(r) },
    { id:'dean',   l:'لدى العميد',  f:r => r.status==='at_dean' },
    { id:'closed', l:'المكتملة',    f:r => ['closed','withdrawn'].includes(r.status) },
    { id:'all',    l:'الكل',        f:() => true },
  ];
  S.tab = 'action';
}
function renderTabs(){
  $('#tabs').innerHTML = TABS.map(t => `<button class="tab ${S.tab===t.id?'on':''}" data-t="${t.id}">${t.l}<span class="n">${S.rows.filter(t.f).length}</span></button>`).join('');
}
$('#tabs').addEventListener('click', e => { const b = e.target.closest('[data-t]'); if (!b) return; S.tab = b.dataset.t; S.kpi = null; renderKpis(); renderTabs(); renderList(); closeIfHidden(); });
$('#q').addEventListener('input', e => { S.q = e.target.value.trim(); renderList(); closeIfHidden(); });
// عند تغيير التبويب أو البحث: تُغلق تفاصيل الطلب المفتوح إن لم يعد ضمن القائمة المعروضة
function closeIfHidden(){
  if (S.sel && !filtered().some(r => r.id === S.sel)) { S.sel = null; $('#detail').hidden = true; renderList(); }
}

/* ================= LIST ================= */
function filtered(){
  let rows = S.rows;
  if (S.kpi) rows = rows.filter(KPIS.find(k=>k.id===S.kpi).f);
  else rows = rows.filter(TABS.find(t=>t.id===S.tab).f);
  if (S.q) {
    const q = S.q.replace(/[٠-٩]/g, d => d.charCodeAt(0)-1632).toLowerCase();
    rows = rows.filter(r => [r.student_name, r.university_id, r.ref_no, r.mobile, r.summary, r.enjaz_no, r.college, r.department].some(v => String(v||'').toLowerCase().includes(q)));
  }
  return rows;
}
function renderList(){
  const rows = filtered();
  if (!rows.length) { $('#list').innerHTML = '<div class="empty">لا توجد طلبات هنا 🌿</div>'; return; }
  $('#list').innerHTML = rows.map(r => `
    <div class="item ${S.sel===r.id?'on':''}" data-id="${r.id}">
      <div class="nm">${esc(r.student_name)}</div>
      <div><span class="pill ${pillClass(r)}">${statusLabel(r)}</span></div>
      <div class="sm">${esc(r.summary)}</div>
      <div class="mt"><span class="rf ltr">${esc(r.ref_no)}</span>·<span class="tag">${CATEGORY[r.category]||''}</span><span class="tag">${GENDER[r.gender]||''} · ${esc(r.department)}</span>${r.college ? `<span class="tag" style="background:var(--warn-soft);color:var(--warn)">${esc(r.college)}</span>` : ''}·${replied(r) ? '<span class="tag rep">↩ استكمل الطالب</span>' : ''}<span class="${isLate(r)?'late':''}">${isLate(r)?'⚠ متأخر · ':''}${ago(r.updated_at)}</span></div>
      ${r.dean_decision ? `<div class="dsum ds-${r.dean_decision}">
        <div class="dl"><b>التوجيه:</b> ${DECISION[r.dean_decision]}${r.referred_to ? ` · يُحال إلى ${esc(r.referred_to)}` : ''}</div>
        ${r.dean_note ? `<div class="dn">«${esc(r.dean_note.replace(/\s+/g,' '))}»</div>` : ''}
        <div class="dm">${r.decided_at ? `<span>🗓 ${hijri(r.decided_at)}</span>` : ''}${r.enjaz_no ? `<span>إنجاز: <b class="ltr">${esc(r.enjaz_no)}</b></span>` : (r.status==='closed' ? '' : '<span class="wait">بانتظار الإقفال</span>')}</div>
      </div>` : ''}
      ${r.status==='withdrawn' ? `<div class="dsum ds-withdrawn"><div class="dl">سحبه الطالب قبل استلامه</div></div>` : ''}
      ${canTake(r) ? `<div class="take-row"><button class="take-card" data-take="${r.id}" type="button">${TAKE_ICON}استلام الطلب</button></div>` : ''}
    </div>`).join('');
}
const pillClass = r => ['approved','rejected','reserved','referred','closed'].includes(r.status) && r.dean_decision ? `dec dec-${r.dean_decision}` : `t-${r.status}`;
function statusLabel(r){
  if (r.status==='referred') return 'محال · ' + (DECISION[r.dean_decision]||'');
  if (r.status==='closed' && r.dean_decision) return 'مغلق · ' + DECISION[r.dean_decision];
  return STATUS[r.status]?.l || r.status;
}
$('#list').addEventListener('click', async e => {
  const tb = e.target.closest('[data-take]');
  if (tb) {
    e.stopPropagation(); tb.disabled = true;
    const ok = await run(() => sb.rpc('req_take', { p_id: tb.dataset.take }), 'تم استلام الطلب ✓');
    if (ok) openReq(tb.dataset.take); else tb.disabled = false;
    return;

  const it = e.target.closest('.item'); if (!it) return; openReq(it.dataset.id);

/* ================= DETAIL ================= */
async function openReq(id){
  S.sel = id; renderList();
  const r = S.rows.find(x => x.id === id); if (!r) return;
  renderDetail(r);
}
async function fetchExtras(r){
  const [{ data: files }, { data: events }] = await Promise.all([
    sb.from('request_files').select('*').eq('request_id', r.id).order('created_at'),
    sb.from('request_events').select('*').eq('request_id', r.id).order('created_at'),
  ]);
  const signed = await Promise.all((files||[]).map(async f => {
    const { data } = await sb.storage.from(CONFIG.BUCKET).createSignedUrl(f.path, 3600);
    return { ...f, url: data?.signedUrl };
  }));
  return { files: signed, events: events||[] };
}
const H = () => S.settings.dean_honorific || 'سعادة';
const who = id => { const p = S.people[id]; return p ? p.full_name : ''; };
const deanName = () => {
  if (S.settings.dean_name) return S.settings.dean_name;
  const d = Object.values(S.people).find(p => p.role==='dean' && p.active); return d ? ((d.title ? d.title+' ' : '') + d.full_name) : '';
};

/* ---------------- dean composer ---------------- */
function wireComposer(r){
  let decision = null;
  const chips = $('#decChips'), note = $('#decNote');
  const paint = () => {
    const list = decision ? PHRASES[decision] : [...PHRASES.approved.slice(0,2), ...PHRASES.reserved.slice(0,2)];
    chips.innerHTML = list.map(p => `<button type="button" class="chip">${p}</button>`).join('');
  };
  paint();
  $('#decBtns').onclick = e => { const b = e.target.closest('[data-v]'); if (!b) return; decision = b.dataset.v; $$('#decBtns button').forEach(x => x.classList.toggle('on', x===b)); paint(); };
  chips.onclick = e => { const c = e.target.closest('.chip'); if (!c) return; note.value = note.value.trim() ? note.value.trim() + '، ' + c.textContent : c.textContent; note.focus(); };
  $('#decSave').onclick = async () => {
    if (!decision) { toast('اختر: موافق أو غير موافق أو متحفظ', 'error'); return; }
    const ref = $('#decRef').value;
    const ok = await confirmBox('اعتماد التوجيه',
      `<div style="font-size:15px">سيُعتمد التوجيه التالي على الطلب <b class="ltr">${esc(r.ref_no)}</b>:</div>
       <div class="box dean"><div class="dc">${DECISION[decision]}</div>${ref ? `<div>ويُحال إلى: <b>${esc(ref)}</b></div>` : ''}${note.value.trim() ? `<div style="white-space:pre-wrap">${esc(note.value.trim())}</div>` : ''}</div>`, 'اعتماد');
    if (!ok) return;
    await run(() => sb.rpc('req_decide', { p_id:r.id, p_decision:decision, p_referred_to:ref || null, p_note:note.value.trim() || null }), 'اعتُمد التوجيه ✓');
  };
  const ret = $('#decReturn');
  if (ret) ret.onclick = () => formBox('إعادة الطلب إلى المكتب', [{ id:'n', label:'سبب الإعادة / المطلوب من المكتب', area:true, required:true, chips:['يُستكمل ما يثبت العذر','يُرفق رأي القسم','يُتحقق من السجل الأكاديمي'] }], 'إعادة',
    v => sb.rpc('req_return', { p_id:r.id, p_note:v.n }), 'أُعيد إلى المكتب');
}

/* ---------------- actions ---------------- */
async function run(fn, okMsg){
  try { const { error } = await fn(); if (error) throw error; toast(okMsg, 'ok'); delete S.cache[S.sel]; await load(true); return true; }
  catch (e) { console.error(e); toast(errText(e), 'error'); return false; }
}
function act(a, r){
  if (a==='take') return run(() => sb.rpc('req_take', { p_id:r.id }), 'تم الاستلام ✓');
  if (a==='forward') return formBox(`رفع الطلب لـ${H()} العميد`, [{ id:'n', label:'مرئيات المكتب (تظهر للعميد وفي النموذج المطبوع)', area:true, pick:true, chips:PHRASES.forward, closing:PHRASES.forwardClosing, value:r.office_note||'' }], 'رفع للعميد',
    v => sb.rpc('req_forward', { p_id:r.id, p_office_note:v.n || null }), `رُفع لـ${H()} العميد ✓`);
  if (a==='info') return formBox('طلب استكمال من الطالب', [{ id:'m', label:'الرسالة التي ستظهر للطالب في صفحة المتابعة', area:true, required:true, pick:true, chips:PHRASES.info }], 'إرسال',
    v => sb.rpc('req_request_info', { p_id:r.id, p_message:v.m }), 'أصبح الطلب «بانتظار استكمال»');
  if (a==='close') return formBox('إقفال الطلب', [
      { id:'e', label:'رقم معاملة إنجاز (إن وُجد)', value:r.enjaz_no||'', ltr:true },
      { id:'m', label:'الرسالة الظاهرة للطالب', area:true, pick:true, chips:Object.values(PHRASES.close), value: r.student_message || PHRASES.close[r.dean_decision] || '' },
    ], 'إقفال', v => sb.rpc('req_close', { p_id:r.id, p_enjaz_no:v.e || null, p_student_message:v.m || null }), 'أُقفل الطلب ✓');
  if (a==='info2') return formBox('رقم إنجاز ورسالة الطالب', [
      { id:'e', label:'رقم معاملة إنجاز', value:r.enjaz_no||'', ltr:true },
      { id:'m', label:'الرسالة الظاهرة للطالب في صفحة المتابعة', area:true, pick:true, chips:[...Object.values(PHRASES.close), ...PHRASES.info], value:r.student_message||'' },
    ], 'حفظ', v => sb.rpc('req_update_info', { p_id:r.id, p_enjaz_no:v.e || null, p_student_message:v.m || null }), 'تم الحفظ ✓');
  if (a==='note') return formBox('ملاحظة داخلية', [{ id:'n', label:'لا تظهر للطالب ولا في النموذج المطبوع', area:true, required:true }], 'حفظ',
    v => sb.rpc('req_note', { p_id:r.id, p_note:v.n }), 'أُضيفت الملاحظة');
  if (a==='reopen') return formBox('إعادة فتح الطلب', [{ id:'n', label:'سبب إعادة الفتح (يُمسح التوجيه الحالي ويعود الطلب للعميد)', area:true, required:true }], 'إعادة فتح',
    v => sb.rpc('req_reopen', { p_id:r.id, p_note:v.n }), 'أُعيد فتح الطلب');
  if (a==='print') return printForm(r);
}

/* ---------------- modal helpers ---------------- */
function modal(title, body, foot){ $('#modH').textContent = title; $('#modC').innerHTML = body; $('#modF').innerHTML = foot; $('#mod').classList.add('on'); }
function closeModal(){ $('#mod').classList.remove('on'); }
$('#mod').addEventListener('click', e => { if (e.target.id==='mod') closeModal(); });
addEventListener('keydown', e => { if (e.key==='Escape') closeModal(); });
function confirmBox(title, html, okText){
  return new Promise(res => {
    modal(title, html, `<button class="btn teal" id="mOk">${okText}</button><button class="btn ghost" id="mNo">إلغاء</button>`);
    $('#mOk').onclick = () => { closeModal(); res(true); };
    $('#mNo').onclick = () => { closeModal(); res(false); };
  });
}
/* «اختيار» العبارات الجاهزة: تُحدَّد وتُلغى بالضغط، وتُحفظ كل عبارة في سطر بنقطة،
   ثم النص الحر، ثم العبارة الختامية (إن وُجدت واختيرت) في آخر سطر */
function splitPicked(value, chips, closing){
  const picked = new Set(); const free = [];
  String(value||'').split('\n').forEach(line => {
    const t = line.trim(); if (!t) return;
    const b = t.replace(/^•\s*/, '');
    if (chips.includes(b)) picked.add(b);
    else if (closing && t === closing) picked.add(closing);
    else free.push(line);
  });
  return { picked, free: free.join('\n') };
}
function composePicked(picked, free, chips, closing){
  const sel = chips.filter(c => picked.has(c));
  const lines = (sel.length + (free.trim() ? 1 : 0) > 1) ? sel.map(c => '• ' + c) : sel;
  if (free.trim()) lines.push(free.trim());
  if (closing && picked.has(closing)) lines.push(closing);
  return lines.join('\n');
}
function formBox(title, fields, okText, submit, okMsg){
  const P = {};
  fields.forEach(f => { if (f.pick) { const sp = splitPicked(f.value, f.chips, f.closing); P[f.id] = sp.picked; f._free = sp.free; } });
  modal(title, fields.map(f => {
    const val = f.pick ? f._free : (f.value||'');
    const chipList = f.pick ? [...f.chips, ...(f.closing ? [f.closing] : [])] : f.chips;
    return `<div><label class="l" for="mf_${f.id}">${f.label}${f.required?' <span style="color:var(--bad)">*</span>':''}</label>
      ${f.pick ? `<div class="picks" data-pick="${f.id}">${chipList.map(c=>`<button type="button" class="pick ${P[f.id].has(c)?'on':''} ${c===f.closing?'closing':''}" data-v="${esc(c)}">${esc(c).replace(/https:\/\/\S+/, '<span class="lnk">🔗 رابط المتابعة</span>')}</button>`).join('')}</div>
        <div class="l" style="margin:10px 0 5px;font-weight:600;color:var(--muted);font-size:12.5px">${f.freeLabel || 'نص إضافي (اختياري)'}</div>` : ''}
      ${f.area ? `<textarea class="textarea" id="mf_${f.id}" ${f.pick?'style="min-height:70px"':''}>${esc(val)}</textarea>` : `<input class="input ${f.ltr?'ltr':''}" id="mf_${f.id}" value="${esc(val)}">`}
      ${!f.pick && f.chips ? `<div class="chips">${f.chips.map(c=>`<button type="button" class="chip" data-for="mf_${f.id}">${esc(c)}</button>`).join('')}</div>` : ''}</div>`;
  }).join(''),
    `<button class="btn pri" id="mOk">${okText}</button><button class="btn ghost" id="mNo">إلغاء</button>`);
  $('#modC').onclick = e => {
    const pk = e.target.closest('.pick');
    if (pk) { const set = P[pk.parentElement.dataset.pick]; const v = pk.dataset.v; set.has(v) ? set.delete(v) : set.add(v); pk.classList.toggle('on', set.has(v)); return; }
    const c = e.target.closest('.chip'); if (!c) return; const t = $('#'+c.dataset.for); t.value = t.value.trim() ? t.value.trim() + '، ' + c.textContent : c.textContent; t.focus();
  };
  $('#mNo').onclick = closeModal;
  $('#mOk').onclick = async () => {
    const v = {};
    for (const f of fields) {
      const raw = $('#mf_'+f.id).value.trim();
      v[f.id] = f.pick ? composePicked(P[f.id], raw, f.chips, f.closing) : raw;
      if (f.required && !v[f.id]) { toast(f.pick ? 'اختر عبارة أو اكتب نصاً' : 'اكتب '+f.label.split('(')[0].trim(), 'error'); return; }
    }
    $('#mOk').disabled = true;
    const ok = await run(() => submit(v), okMsg);
    if (ok) closeModal(); else $('#mOk').disabled = false;
  };
  setTimeout(() => $('#mf_'+fields[0].id)?.focus(), 50);
}
$('#btnRefresh').addEventListener('click', () => { S.cache = {}; load(); });
$('#btnPass').addEventListener('click', () => {
  modal('تغيير كلمة المرور', `<div><label class="l" for="np">كلمة المرور الجديدة (8 أحرف على الأقل)</label><input class="input ltr" type="password" id="np" autocomplete="new-password"></div>`,
    `<button class="btn pri" id="mOk">حفظ</button><button class="btn ghost" id="mNo">إلغاء</button>`);
  $('#mNo').onclick = closeModal;
  $('#mOk').onclick = async () => {

    const { error } = await sb.auth.updateUser({ password:p }); if (error) return toast(errText(error), 'error');
    closeModal(); toast('تم تغيير كلمة المرور ✓', 'ok');
  };
});

/* ---------------- settings: dean name + delegation ---------------- */
$('#btnSettings').addEventListener('click', () => {
  const st = S.settings, staff = Object.values(S.people).filter(p => ['admin','office'].includes(p.role) && p.active);
  const today = new Date(); const iso = d => d.toISOString().slice(0,10);
  modal('الإعدادات', `
    <div style="font-weight:700;color:var(--navy)">بيانات العميد في النموذج المطبوع</div>
    <div style="display:grid;grid-template-columns:110px 1fr;gap:8px">
      <div><label class="l" for="sHon">اللقب</label><select class="select" id="sHon">${['فضيلة','سعادة'].map(x=>`<option ${st.dean_honorific===x?'selected':''}>${x}</option>`).join('')}</select></div>
      <div><label class="l" for="sName">الاسم كما يظهر تحت التوجيه</label><input class="input" id="sName" value="${esc(st.dean_name||'')}" placeholder="مثال: د. ..."></div>
    </div>
    <div><label class="l" for="sTitle">المسمى</label><input class="input" id="sTitle" value="${esc(st.dean_title||'عميد كلية الشريعة')}"></div>
    <button class="btn pri" id="sSave" style="align-self:flex-start">حفظ بيانات العميد</button>
    <hr style="border:0;border-top:1px solid var(--line);width:100%">
    <div style="font-weight:700;color:var(--navy)">التفويض بالتوجيه</div>
    <div class="hint">الموظف المفوَّض يستطيع اعتماد التوجيه حتى التاريخ المحدد، ويظهر التوجيه في النموذج باسم العميد، ويُحفظ في السجل من نفّذه فعلياً.</div>
    <table class="ut"><tr><th>الموظف</th><th>مفوَّض حتى</th><th></th></tr>
      ${staff.map(p => { const on = p.delegate_until && new Date(p.delegate_until) > today; return `<tr>
        <td>${esc(p.full_name)}<div style="font-size:11.5px;color:var(--muted)">${ROLES[p.role]}</div></td>
        <td>${on ? `<b style="color:var(--teal)">${hijri(p.delegate_until)}</b>` : '<span style="color:var(--muted)">—</span>'}</td>
        <td style="white-space:nowrap">${on ? `<button class="btn danger" data-stop="${p.id}" style="padding:5px 10px">إيقاف</button>`
             : `<input type="date" class="input ltr" style="width:140px;padding:5px 8px;display:inline-block" data-d="${p.id}" value="${iso(new Date(today.getTime()+7*864e5))}"> <button class="btn teal" data-go="${p.id}" style="padding:5px 10px">تفويض</button>`}</td></tr>`; }).join('') || '<tr><td colspan="3" style="color:var(--muted)">لا يوجد موظفون</td></tr>'}
    </table>`,
    `<button class="btn ghost" id="mNo">إغلاق</button>`);
  $('#mNo').onclick = closeModal;
  $('#sSave').onclick = async () => {
    const { error } = await sb.from('settings').update({ dean_honorific:$('#sHon').value, dean_name:$('#sName').value.trim()||null, dean_title:$('#sTitle').value.trim()||'عميد كلية الشريعة', updated_at:new Date().toISOString() }).eq('id',1);
    if (error) return toast(errText(error), 'error');
    const { data } = await sb.from('settings').select('*').eq('id',1).maybeSingle(); S.settings = data||S.settings; toast('تم الحفظ ✓','ok');
  };
  $('#modC').querySelector('.ut').onclick = async e => {
    const go = e.target.closest('[data-go]'), stop = e.target.closest('[data-stop]');
    if (!go && !stop) return;
    const id = (go||stop).dataset.go || (go||stop).dataset.stop;
    let until = null;
    if (go) { const d = document.querySelector(`[data-d="${id}"]`).value; if (!d) return toast('اختر تاريخ نهاية التفويض','error'); until = new Date(d+'T23:59:59+03:00').toISOString(); }
    const { error } = await sb.rpc('set_delegation', { p_user:id, p_until:until });
    if (error) return toast(errText(error), 'error');
    const { data: ppl } = await sb.from('profiles').select('id,full_name,role,title,active,delegate_until,email');
    S.people = Object.fromEntries((ppl||[]).map(p => [p.id, p]));
    toast(go ? 'تم التفويض ✓' : 'أُوقف التفويض', 'ok'); closeModal(); $('#btnSettings').click();
  };
});

    catch { return { ...f, plink: f.url }; }

    : `<div class="empty-dir">لم يصدر التوجيه بعد</div>`;

      </div>
    </div>
    <div class="acc"></div>
    <div class="salute"><div class="hz"><span>${hon} عميد كلية الشريعة</span><span>حفظه الله</span></div>السلام عليكم ورحمة الله وبركاته،</div>
    <p class="intro">أتقدّم إليكم بطلبي هذا رقم (<b class="ltr">${esc(r.ref_no)}</b>) وتاريخ (<b>${hijri(r.created_at)}</b>) وفق البيانات أدناه:</p>
    <div class="sec-t">بيانات الطلب</div>
    <table>
      <tr><th>نوع الطلب</th><td>${CATEGORY[r.category]}</td><th>المرفقات</th><td>${files.length===1 ? 'مرفق واحد' : files.length===2 ? 'مرفقان' : files.length ? files.length + ' مرفقات' : 'لا توجد'}</td></tr>
      <tr><th>المطلوب</th><td colspan="3">${esc(r.summary)}</td></tr>
      <tr><th>سبب عدم التقديم إلكترونياً</th><td colspan="3">${r.bypass_reason==='other' ? esc(r.bypass_other) : BYPASS[r.bypass_reason]}</td></tr>
    </table>
    <div class="blk"><h4>المبررات والظروف</h4><div>${esc(r.justification)}</div></div>
    ${files.length ? `<div class="blk flist"><h4>قائمة المرفقات <span class="hint">(اضغط على اسم المرفق لفتحه — الرابط صالح ${LINK_DAYS} أيام)</span></h4><div>${files.map((f,i)=>`${i+1}. ${f.plink ? `<a href="${esc(f.plink)}" target="_blank">${esc(f.name)}</a>` : esc(f.name)}`).join('&nbsp;&nbsp;&nbsp; ')}</div></div>` : ''}
    <div class="sec-t">بيانات الطالب</div>
    <table>
      <tr><th>الاسم</th><td>${esc(r.student_name)}</td><th>الرقم الجامعي</th><td class="ltr">${esc(r.university_id)}</td></tr>
