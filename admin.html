<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12306b">
<meta name="robots" content="noindex,nofollow">
<title>مكتب العميد الرقمي | كلية الشريعة</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{
  --navy:#12306b; --navy-2:#1d4690; --navy-soft:#e7edf8;
  --teal:#11908f; --teal-soft:#e2f3f2;
  --ink:#1c2431; --muted:#66707e; --line:#e1e6ee; --bg:#f4f6fa; --card:#fff;
  --ok:#1f7a55; --ok-soft:#e5f3ec; --warn:#a86a12; --warn-soft:#fbf1df;
  --bad:#b0412e; --bad-soft:#fbe9e5; --info:#2a5d8f; --info-soft:#e7eff8;
  --violet:#5b4bb5; --violet-soft:#eeebfb;
  --r:14px; --shadow:0 1px 2px rgba(18,48,107,.05),0 8px 24px rgba(18,48,107,.07);
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;color:var(--ink);background:var(--bg);font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:"Noto Kufi Arabic",sans-serif;line-height:1.5;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
.ltr{direction:ltr;unicode-bidi:isolate}

/* ---------- buttons / inputs ---------- */
.btn{border:0;border-radius:10px;padding:9px 16px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:.15s;font-size:14.5px;white-space:nowrap}
.btn svg{width:17px;height:17px;flex:none}
.btn.pri{background:var(--navy);color:#fff}.btn.pri:hover{background:var(--navy-2)}
.btn.teal{background:var(--teal);color:#fff}.btn.teal:hover{filter:brightness(1.07)}
.btn.ghost{background:#eef1f6;color:var(--ink)}.btn.ghost:hover{background:#e3e8f0}
.btn.line{background:#fff;border:1px solid var(--line);color:var(--ink)}.btn.line:hover{border-color:#c6cfdd}
.btn.warn{background:var(--warn-soft);color:var(--warn)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.input,.select,.textarea{width:100%;border:1.5px solid var(--line);background:#fafbfd;border-radius:10px;padding:9px 12px;outline:none;transition:.15s;font-size:15px}
.input:focus,.select:focus,.textarea:focus{border-color:var(--navy-2);background:#fff;box-shadow:0 0 0 4px var(--navy-soft)}
.textarea{resize:vertical;min-height:84px;line-height:1.8}
label.l{display:block;font-weight:600;font-size:13.5px;margin:0 0 5px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.picks{display:flex;flex-wrap:wrap;gap:7px}
.pick{border:1.5px solid #d3dbe8;background:#fff;border-radius:999px;padding:5px 13px;font-size:13px;cursor:pointer;color:var(--ink);font-weight:500;transition:.12s}
.pick:hover{border-color:var(--navy-2)}
.pick.on{background:var(--navy);border-color:var(--navy);color:#fff}
.pick.on::before{content:"✓ "}
.pick.closing{border-style:dashed}
.pick .lnk{font-weight:700;white-space:nowrap}
.pick.closing.on{background:var(--teal);border-color:var(--teal);border-style:solid}
.chip{border:1px dashed #c7d0de;background:#fff;border-radius:999px;padding:3px 11px;font-size:12.5px;cursor:pointer;color:var(--navy-2)}
.chip:hover{background:var(--navy-soft);border-style:solid}

/* ---------- login ---------- */
.login{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:linear-gradient(160deg,var(--navy) 0%,#0c2350 60%,#0a1c40 100%)}
.login .box{background:#fff;border-radius:20px;padding:30px 26px;width:100%;max-width:400px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.login img{width:220px;display:block;margin:0 auto 6px}
.login h1{font-size:19px;text-align:center;color:var(--navy);margin:6px 0 2px}
.login p.sub{text-align:center;color:var(--muted);margin:0 0 20px;font-size:13.5px}
.login .f{margin-bottom:12px}
.login .btn{width:100%;padding:11px}
.login .link{display:block;text-align:center;margin-top:12px;color:var(--navy-2);font-size:13.5px;cursor:pointer;background:none;border:0}
.login .msg{font-size:13.5px;border-radius:10px;padding:9px 12px;margin-bottom:12px}
.login .msg.err{background:var(--bad-soft);color:var(--bad)}
.login .msg.ok{background:var(--ok-soft);color:var(--ok)}

/* ---------- shell ---------- */
.top{background:var(--navy);color:#fff;position:sticky;top:0;z-index:20;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.top::after{content:"";display:block;height:3px;background:linear-gradient(90deg,transparent,var(--teal),transparent)}
.top .in{max-width:1320px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px}
.top img{height:40px}
.top .ttl{font-family:"Noto Kufi Arabic";font-weight:700;font-size:15px;border-inline-start:1px solid rgba(255,255,255,.25);padding-inline-start:14px}
.top .sp{flex:1}
.who{display:flex;align-items:center;gap:10px;font-size:13.5px}
.who .role{background:rgba(255,255,255,.14);border-radius:999px;padding:2px 10px;font-size:12px}
.who .deleg{background:var(--teal);border-radius:999px;padding:2px 10px;font-size:12px}
.ibtn{background:rgba(255,255,255,.1);border:0;color:#fff;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;cursor:pointer}
.ibtn:hover{background:rgba(255,255,255,.2)}
.ibtn svg{width:18px;height:18px}
@media (max-width:720px){.top .ttl,.who .nm{display:none}.top img{height:34px}}

main.app{max-width:1320px;margin:0 auto;padding:18px 16px 40px}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:16px}
@media (max-width:1000px){.kpis{grid-template-columns:repeat(3,1fr)}}
@media (max-width:520px){.kpis{grid-template-columns:repeat(3,1fr);gap:6px}.kpi{padding:8px 9px}.kpi b{font-size:20px}.kpi span{font-size:11px;line-height:1.35;display:block}}
.kpi{background:#fff;border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow);border:1px solid rgba(0,0,0,.02);cursor:pointer;text-align:right;border-inline-start:4px solid var(--c,var(--navy));transition:.15s}
.kpi:hover{transform:translateY(-1px)}
.kpi.on{outline:2px solid var(--c,var(--navy));outline-offset:-2px}
.kpi b{display:block;font-size:26px;line-height:1.2;font-family:"IBM Plex Sans Arabic";color:var(--c,var(--navy))}
.kpi span{font-size:12.5px;color:var(--muted);font-weight:600}

/* toolbar */
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.tabs{display:flex;background:#fff;border-radius:12px;padding:4px;box-shadow:var(--shadow);gap:2px;overflow-x:auto;max-width:100%}
.tab{border:0;background:none;padding:7px 13px;border-radius:9px;cursor:pointer;font-weight:600;color:var(--muted);white-space:nowrap;font-size:14px}
.tab .n{display:inline-block;min-width:20px;padding:0 6px;border-radius:999px;background:#eef1f6;color:var(--muted);font-size:11.5px;margin-inline-start:4px}
.tab.on{background:var(--navy);color:#fff}.tab.on .n{background:rgba(255,255,255,.2);color:#fff}
.search{flex:1;min-width:200px;position:relative}
.search input{padding-inline-start:36px}
.search svg{position:absolute;right:11px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--muted)}

/* list */
.home{display:flex;flex-direction:column;gap:14px}
.detail:not([hidden]) ~ .home{display:none}
@media (max-width:980px){.home{display:none}}
.hcard{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);padding:18px 20px}
.hero{background:linear-gradient(135deg,var(--navy) 0%,#1d4690 60%,var(--teal) 140%);color:#fff;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:auto -60px -80px auto;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.06)}
.hero small{opacity:.8;font-size:13px}
.hero h2{margin:2px 0 14px;font-family:"Noto Kufi Arabic";font-size:21px}
.hero .st{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.12);border-radius:12px;padding:12px 14px;position:relative;z-index:1}
.hero .st .ic{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.18);font-size:18px;flex:none}
.hero .st b{display:block;font-size:15px}.hero .st span{font-size:13px;opacity:.85}
.hero .st button{margin-inline-start:auto;background:#fff;color:var(--navy);border:0;border-radius:10px;padding:8px 14px;font:inherit;font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap}
.hcard h4{margin:0 0 12px;color:var(--navy);font-size:14.5px;display:flex;align-items:center;gap:8px}
.hcard h4 small{color:var(--muted);font-weight:500;margin-inline-start:auto;font-size:12px}
.wk{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.wk div{background:#f6f8fc;border-radius:12px;padding:12px 14px}
.wk b{display:block;font-size:24px;color:var(--navy);font-family:"Noto Kufi Arabic";line-height:1.3}
.wk span{font-size:12.5px;color:var(--muted)}
.rec{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;width:100%;border:0;background:none;padding:9px 4px;border-bottom:1px solid #eef1f6;font:inherit;text-align:right;cursor:pointer;color:var(--ink)}
.rec:last-child{border-bottom:0}.rec:hover{background:#f8fafd}
.rec .rf{font-weight:700;color:var(--navy);font-size:13px}.rec .n{font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rec .a{font-size:12px;color:var(--muted)}.rec .pill{font-size:11.5px}
.qk{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.qk button,.qk a{display:flex;flex-direction:column;align-items:flex-start;gap:4px;border:1px solid var(--line);background:#fafbfd;border-radius:12px;padding:12px;font:inherit;text-align:right;cursor:pointer;color:var(--ink);text-decoration:none}
.qk button:hover,.qk a:hover{border-color:#b9c6dc;background:#fff}
.qk i{font-style:normal;font-size:18px}.qk b{font-size:13.5px}.qk span{font-size:12px;color:var(--muted)}
.hnote{font-size:12.5px;color:var(--muted);text-align:center;padding:2px 0}
.empty2{text-align:center;padding:34px 20px;background:#fff;border-radius:var(--r);box-shadow:var(--shadow)}
.empty2 .ei{width:58px;height:58px;border-radius:50%;margin:0 auto 10px;display:grid;place-items:center;background:var(--ok-soft);color:var(--ok);font-size:26px}
.empty2 b{display:block;font-size:15.5px;color:var(--ink)}.empty2 p{margin:4px 0 0;color:var(--muted);font-size:13.5px;line-height:1.8}
.empty2 button{margin-top:12px}
.layout{display:grid;grid-template-columns:minmax(330px,420px) 1fr;gap:16px;align-items:start}
@media (max-width:980px){.layout{grid-template-columns:1fr}}
.list{display:flex;flex-direction:column;gap:8px}
.item{background:#fff;border-radius:12px;padding:12px 14px;box-shadow:var(--shadow);cursor:pointer;border:1.5px solid transparent;transition:.12s;display:grid;grid-template-columns:1fr auto;gap:2px 10px}
.item:hover{border-color:#d3dbe8}
.item.on{border-color:var(--navy)}
.item .nm{font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .rf{font-size:12.5px;color:var(--muted);font-weight:600}
.item .lb{color:var(--muted);font-weight:500;font-size:12.5px}
.item .sm{grid-column:1/-1;color:var(--ink);font-size:13.5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .mt{grid-column:1/-1;display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:4px;font-size:12px;color:var(--muted)}
.late{color:var(--bad);font-weight:700}
.empty{text-align:center;color:var(--muted);padding:40px 16px;background:#fff;border-radius:var(--r);box-shadow:var(--shadow)}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-weight:700;font-size:12px;white-space:nowrap}
.t-new{background:var(--info-soft);color:var(--info)}
.t-in_review{background:var(--navy-soft);color:var(--navy-2)}
.t-needs_info{background:var(--warn-soft);color:var(--warn)}
.t-at_dean{background:var(--violet-soft);color:var(--violet)}
.t-referred,.t-approved{background:var(--ok-soft);color:var(--ok)}
.t-rejected{background:var(--bad-soft);color:var(--bad)}
.t-reserved{background:var(--warn-soft);color:var(--warn)}
.t-directed{background:var(--navy-soft);color:var(--navy-2)}
/* حالات التوجيه: ممتلئة بلون القرار مع رمز، لتتميّز عن زر «استلام الطلب» */
.pill.dec{color:#fff;border-radius:7px;padding:2px 9px;display:inline-flex;align-items:center;gap:4px}
.pill.dec::before{font-weight:900}
.pill.dec-approved{background:#1f8a57}.pill.dec-approved::before{content:"✓"}
.pill.dec-directed{background:var(--navy-2)}.pill.dec-directed::before{content:"✎"}
.pill.dec-rejected{background:#b8432f}.pill.dec-rejected::before{content:"✕"}
.pill.dec-reserved{background:#c07a12}.pill.dec-reserved::before{content:"!"}
.t-closed,.t-withdrawn{background:#eceff3;color:var(--muted)}
.btn.take{background:#1f9d63;color:#fff;box-shadow:0 2px 8px rgba(31,157,99,.25)}
.btn.take:hover{background:#178553}
.take-row{grid-column:1/-1;display:flex;justify-content:flex-end;border-top:1px dashed var(--line);margin-top:9px;padding-top:9px}
.take-card{display:inline-flex;align-items:center;gap:5px;border:1px solid #9fd8b9;background:#ecf8f1;color:#17663f;border-radius:999px;padding:4px 14px 4px 12px;font-weight:700;font-size:12.5px;cursor:pointer;transition:.15s}
.take-card svg{width:14px;height:14px}
.take-card:hover{background:#1f9d63;border-color:#1f9d63;color:#fff;box-shadow:0 2px 8px rgba(31,157,99,.25)}
.take-card:disabled{opacity:.6;cursor:wait}
.waitst{background:var(--warn-soft);color:#7a4b06;border-radius:12px;padding:10px 14px;margin-top:14px;font-size:13.5px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.waitst .btn{padding:6px 12px;font-size:12.5px}
.atdean{background:var(--violet-soft);color:#4a3d99;border-radius:12px;padding:10px 14px;margin-top:14px;font-size:13.5px}
.recv{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:#e9f7ef;border:1px solid #bfe5cf;border-radius:12px;padding:12px 14px;margin-top:14px}
.recv div{flex:1;min-width:200px}
.recv b{display:block;color:#17663f}
.recv span{font-size:13px;color:#3c6b53}
.note-link{margin-inline-start:auto;background:none;border:1px dashed #c7d0de;border-radius:999px;padding:2px 10px;font-size:12px;color:var(--navy-2);cursor:pointer;font-family:"IBM Plex Sans Arabic",sans-serif;font-weight:600}
.note-link:hover{background:var(--navy-soft)}
.dsum{grid-column:1/-1;margin-top:8px;border-radius:9px;padding:7px 10px;font-size:12.5px;border-inline-start:3px solid;background:#f6f8fb;line-height:1.7}
.dsum .dl{color:var(--ink)}
.dsum .dl b{font-weight:700}
.dsum .dn{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dsum .dm{display:flex;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:11.5px;margin-top:2px}
.dsum .dm .wait{color:var(--teal);font-weight:700}
.ds-approved{border-color:#1f8a57;background:#f0f8f3}
.ds-directed{border-color:var(--navy-2);background:#f2f5fb}
.ds-rejected{border-color:#b8432f;background:#fcf2f0}
.ds-reserved{border-color:#c07a12;background:#fdf6ea}
.ds-withdrawn{border-color:#9aa3b2}
.tag.rep{background:var(--warn-soft);color:var(--warn);font-weight:700}
.box.reply{background:#fffaf0;border:1px solid #efd7ad}
.file .stg{display:block;background:var(--warn-soft);color:var(--warn);font-size:10.5px;text-align:center;font-weight:700}
.tag{background:#f0f2f6;border-radius:6px;padding:1px 7px}

/* detail */
.detail{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);position:sticky;top:136px;max-height:calc(100vh - 152px);display:flex;flex-direction:column;overflow:hidden}
.d-head{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.d-head .rf{font-size:20px;font-weight:700;color:var(--navy)}
.d-head .sp{flex:1}
.d-close{display:none}
.d-body{padding:4px 18px 18px;overflow:auto;flex:1}
.d-actions{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;background:#fbfcfe}
@media (max-width:980px){
  .detail{position:fixed;inset:0;top:0;max-height:none;border-radius:0;z-index:40}
  .d-close{display:grid}
}
.sec{padding:14px 0;border-bottom:1px dashed var(--line)}
.sec:last-child{border:0}
.sec h3{font-size:13.5px;color:var(--navy);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px 16px}
@media (max-width:520px){.kv{grid-template-columns:1fr 1fr}.d-actions{padding:10px 12px;gap:6px}.d-actions .btn{flex:1 1 45%;padding:8px 10px;font-size:13.5px}}
.kv div small{display:block;color:var(--muted);font-size:12px}
.kv div b{font-weight:600}
.txt{white-space:pre-wrap;word-break:break-word;background:#f8f9fc;border-radius:10px;padding:10px 12px;font-size:14.5px}
.txt+.txt{margin-top:8px}
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.file{border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;background:#fafbfd;text-decoration:none;color:inherit}
.file .th{height:86px;display:grid;place-items:center;background:#eef1f6;color:var(--navy-2);font-weight:700;font-size:13px;overflow:hidden}
.file .th img{width:100%;height:100%;object-fit:cover}
.file .fn{padding:5px 8px;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:ltr;text-align:right}
.box{border-radius:12px;padding:12px 14px;font-size:14.5px}
.box.office{background:var(--navy-soft);white-space:pre-wrap}
.box.dean{background:var(--teal-soft);border-inline-start:4px solid var(--teal)}
.box.dean .dc{font-weight:800;font-size:16px}
.box.stu{background:var(--warn-soft)}
.box small{display:block;color:var(--muted);font-size:12px;margin-top:4px}

/* directive composer */
.direct{border:2px solid var(--teal);border-radius:14px;padding:14px;background:linear-gradient(180deg,#fff,var(--teal-soft))}
.direct h3{color:#0b6e6d}
.dec{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.dec button{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:10px 6px;font-weight:700;cursor:pointer;font-size:15px}
.dec button[data-v=approved].on{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.dec button[data-v=rejected].on{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.chips .chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.wa{background:#1fa855;color:#fff}.btn.wa:hover{background:#178f47}
.btn.wa svg,.wa-mini svg{width:18px;height:18px}
.wa-mini{border:0;background:#e6f6ec;color:#1fa855;width:28px;height:28px;border-radius:8px;display:inline-grid;place-items:center;cursor:pointer;vertical-align:middle;margin-inline-start:6px}
.wa-to{display:flex;align-items:center;gap:10px;background:#e6f6ec;border-radius:10px;padding:9px 12px;font-size:14px;margin-bottom:10px}
.wa-to svg{width:22px;height:22px;color:#1fa855;flex:none}
.wa-to b{direction:ltr;unicode-bidi:isolate}
.wa-how{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin-top:10px;font-size:13.5px}
.wa-how span{color:var(--muted)}.wa-how label{display:flex;align-items:center;gap:6px;cursor:pointer}.wa-how small{color:var(--muted)}
.wa-note{font-size:12.5px;color:var(--muted);margin-top:8px;line-height:1.7}
.dec-hint{font-size:12.5px;color:var(--muted);margin:-4px 0 8px}
.dec button[data-v=reserved].on{border-color:var(--warn);background:var(--warn-soft);color:var(--warn)}
.direct .row2{display:grid;grid-template-columns:1fr;gap:10px}

/* timeline */
.tl{list-style:none;margin:6px 0 0;padding:0;position:relative}
.tl::before{content:"";position:absolute;right:7px;top:10px;bottom:14px;width:2px;background:#e6eaf1}
.tl li{position:relative;padding:0 30px 18px 0}
.tl li:last-child{padding-bottom:4px}
.tl li::before{content:"";position:absolute;right:1px;top:5px;width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid var(--dot,var(--navy-2));box-sizing:border-box}
.tl li.n::before{border-style:dashed;--dot:#9aa5b8}
.tl .tl-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.tl .tl-h b{font-size:14px;font-weight:700;color:var(--ink)}
.tl .tl-h .pill{font-size:11.5px;flex-shrink:0}
.tl .tl-m{color:var(--muted);font-size:12px;margin-top:2px}
.tl .tl-m .int{background:#eef1f6;color:#5b6475;border-radius:6px;padding:1px 7px;margin-inline-start:6px;font-size:11px}
.tl q{display:block;quotes:none;background:#f8f9fc;border-inline-start:3px solid var(--dot,var(--navy-2));border-radius:8px;padding:8px 12px;margin-top:8px;font-size:13px;line-height:1.8;white-space:pre-wrap;color:#2a3140}

/* modal */
.mod{position:fixed;inset:0;background:rgba(10,24,52,.5);backdrop-filter:blur(2px);display:none;place-items:center;z-index:60;padding:16px}
.mod.on{display:grid}
.mod .mb{background:#fff;border-radius:16px;width:100%;max-width:520px;max-height:calc(100vh - 32px);overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.mod .mh{padding:16px 18px;border-bottom:1px solid var(--line);font-family:"Noto Kufi Arabic";font-weight:700;color:var(--navy)}
.mod .mc{padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.mod .mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-start}
.mod .hint{font-size:12.5px;color:var(--muted)}

/* settings table */
.ut{width:100%;border-collapse:collapse;font-size:13.5px}
.ut td,.ut th{padding:7px 6px;border-bottom:1px solid var(--line);text-align:right}
.ut th{color:var(--muted);font-weight:600;font-size:12.5px}

/* ---- التقارير ---- */
.rbtn{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);color:#fff;border-radius:10px;height:36px;padding:0 12px;cursor:pointer;font:inherit;font-size:13.5px;font-weight:600}
.rbtn svg{width:18px;height:18px}.rbtn:hover{background:rgba(255,255,255,.2)}
@media (max-width:720px){.rbtn span{display:none}.rbtn{padding:0 9px}}
.rhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px}
.rhead h2{margin:0;font-family:"Noto Kufi Arabic";color:var(--navy);font-size:22px}
.rper{color:var(--muted);font-size:14px;margin-top:4px}
.rctl{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px;display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center;margin-bottom:14px}
.rctl .chips{display:flex;flex-wrap:wrap;gap:6px}
.rctl .chips button{border:1px solid var(--line);background:#fafbfd;border-radius:999px;padding:6px 13px;cursor:pointer;font:inherit;font-size:13px}
.rctl .chips button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.rdates{display:flex;gap:10px}.rdates label{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.rdates .input{width:auto;padding:6px 10px;font-size:14px}
.ract{display:flex;flex-wrap:wrap;gap:8px;margin-inline-start:auto}
.rtiles{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:12px}
.rtile{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px}
.rtile b{display:block;font-size:28px;color:var(--navy);font-family:"Noto Kufi Arabic";line-height:1.3}
.rtile b.sm{font-size:18px;padding:5px 0 3px}
.rtile span{color:var(--muted);font-size:13px}.rtile em{display:block;font-style:normal;font-size:11.5px;color:var(--teal);margin-top:2px}
.rgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:12px}
.rcard{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px;break-inside:avoid}
.rcard.wide{grid-column:1/-1}
.rcard h4{margin:0 0 10px;color:var(--navy);font-size:14.5px}.rcard h4 small{color:var(--muted);font-weight:500}
.rbar{display:grid;grid-template-columns:minmax(80px,38%) 1fr auto;gap:8px;align-items:center;font-size:13px;margin:7px 0}
.rbar .k{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rbar .tr{height:10px;background:#eef1f6;border-radius:999px;overflow:hidden;display:flex;direction:rtl;justify-content:flex-start}
.rbar .tr i{display:block;height:100%;background:var(--navy-2);border-radius:999px}
.rbar .v{font-weight:700;min-width:54px;text-align:left}.rbar .v small{color:var(--muted);font-weight:500}
.stack{display:flex;gap:2px;height:16px;border-radius:999px;overflow:hidden;margin:4px 0 10px}
.stack i{display:block}
.lg{display:flex;flex-wrap:wrap;gap:8px 20px;font-size:13.5px}.lg span{display:flex;align-items:center;gap:6px}
.lg i{width:10px;height:10px;border-radius:3px;display:inline-block}.lg small{color:var(--muted)}
.rempty{color:var(--muted);font-size:13px;padding:6px 0}
.tw{overflow-x:auto}
.rtbl{width:100%;border-collapse:collapse;font-size:13px}
.rtbl th{background:#f3f6fb;color:var(--navy);font-weight:700;text-align:right;padding:8px 10px;white-space:nowrap}
.rtbl td{padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.rtbl tbody tr[data-open]{cursor:pointer}.rtbl tbody tr[data-open]:hover{background:#f8fafd}
.dtx{font-weight:700}.dtx.approved{color:var(--ok)}.dtx.rejected{color:var(--bad)}.dtx.reserved{color:#a86a12}.dtx.directed{color:var(--navy-2)}
@media (max-width:1100px){.rtiles{grid-template-columns:repeat(3,1fr)}.rgrid{grid-template-columns:1fr 1fr}}
@media (max-width:720px){.rtiles{grid-template-columns:1fr 1fr}.rgrid{grid-template-columns:1fr}.ract{margin-inline-start:0}.rhead h2{font-size:19px}}
/* نسخة الطباعة */
.rptdoc,.rptdoc *{font-family:"Noto Kufi Arabic","IBM Plex Sans Arabic",sans-serif}
.rptdoc{color:#1a1f2b;font-size:10pt}
.rptdoc .rph{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;border-bottom:2px solid var(--navy);padding-bottom:10px;margin-bottom:14px}
.rptdoc .rph img{height:52px}.rptdoc .rph h1{margin:0;font-size:16pt;color:var(--navy)}
.rptdoc .rph div{color:#5b6475;font-size:9.5pt}.rptdoc .rpm{text-align:left;font-size:8.5pt;line-height:1.8}
.rptdoc .rtiles{grid-template-columns:repeat(6,1fr);gap:6px}
.rptdoc .rtile,.rptdoc .rcard{box-shadow:none;border:1px solid #dfe5ee;padding:9px 11px}
.rptdoc .rtile b{font-size:18pt}.rptdoc .rtile b.sm{font-size:11pt}.rptdoc .rtile span{font-size:8.5pt}
.rptdoc .rgrid{grid-template-columns:1fr 1fr;gap:8px}
.rptdoc .rbar{font-size:9pt;margin:4px 0}.rptdoc .rtbl{font-size:8.5pt}.rptdoc .rtbl td,.rptdoc .rtbl th{padding:4px 6px;white-space:normal}
.rptdoc .tblc{break-inside:auto}.rptdoc .rtbl tr{break-inside:avoid}
/* إشعارات الملاحظات (بشكل إشعار الجوال) */
#notifs{position:fixed;top:74px;left:16px;width:min(370px,calc(100% - 32px));z-index:70;display:flex;flex-direction:column;gap:10px;pointer-events:none}
.ntf{pointer-events:auto;background:rgba(255,255,255,.97);backdrop-filter:blur(10px);border-radius:18px;box-shadow:0 14px 40px rgba(18,48,107,.22),0 2px 6px rgba(18,48,107,.08);padding:12px 14px 13px;cursor:pointer;border:1px solid #e3e8f0;animation:ntfIn .45s cubic-bezier(.2,.9,.3,1.2)}
.ntf:hover{box-shadow:0 18px 46px rgba(18,48,107,.28)}
@keyframes ntfIn{from{opacity:0;transform:translateY(-16px) scale(.97)}to{opacity:1;transform:none}}
.ntf .nh{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.ntf .nh .ic{width:22px;height:22px;border-radius:6px;background:var(--navy);display:grid;place-items:center;flex-shrink:0}
.ntf .nh .ic img{width:16px}
.ntf .nh .ap{font-weight:600;color:#3b4456}
.ntf .nh .x{margin-inline-start:auto;border:0;background:#eef1f6;color:#5b6475;width:24px;height:24px;border-radius:50%;cursor:pointer;font-size:14px;line-height:1}
.ntf .nt{font-weight:800;color:var(--ink);font-size:14.5px;margin-top:8px}
.ntf .ns{font-size:12.5px;color:#5b6475;margin-top:1px}
.ntf .nb{font-size:13.5px;color:#2a3140;margin-top:6px;line-height:1.7;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap}
.ntf .no{margin-top:9px;font-size:12.5px;font-weight:700;color:var(--navy-2)}
.ntf.more{padding:8px 14px;text-align:center;font-size:12.5px;color:var(--muted);font-weight:600;animation:none}
.tag.nnote{background:#fff1d6;color:#8a560c;font-weight:700;animation:pulseN 1.6s ease-in-out 3}
@keyframes pulseN{50%{box-shadow:0 0 0 4px rgba(192,122,18,.18)}}
.hist{background:#f5f7fc;border:1px solid #dfe5f1;border-radius:14px;padding:12px 14px;margin-top:14px}
.hist h4{margin:0 0 8px;font-size:14px;color:var(--navy)}
.hist h4 small{color:var(--muted);font-weight:500}
.hrow{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;width:100%;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-top:6px;cursor:pointer;font:inherit;text-align:right;color:var(--ink)}
.hrow:hover{border-color:#b9c6dc}
.hrow .rf{font-weight:700;color:var(--navy);font-size:13px}
.hrow .hs{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

@media (max-width:720px){.hrow{grid-template-columns:auto 1fr auto}.hrow .hd{display:none}}
.newnote{background:linear-gradient(180deg,#fff8ea,#fff3dc);border:1px solid #f1d9a8;border-radius:14px;padding:12px 16px;margin-top:14px}
.newnote h4{margin:0 0 6px;font-size:14px;color:#8a560c;display:flex;align-items:center;gap:6px}
.newnote .it+.it{border-top:1px dashed #ecd3a0;margin-top:8px;padding-top:8px}
.newnote .by{font-size:12px;color:#8a6a3a}
.newnote .tx{font-size:14px;color:#2a3140;white-space:pre-wrap;line-height:1.8;margin-top:2px}
.toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,30px);opacity:0;background:var(--ink);color:#fff;padding:10px 18px;border-radius:12px;font-size:14px;transition:.3s;z-index:80;max-width:calc(100% - 32px);text-align:center;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast.error{background:var(--bad)}.toast.ok{background:var(--ok)}
.spin{width:30px;height:30px;border-radius:50%;border:3px solid var(--navy-soft);border-top-color:var(--navy);margin:0 auto 8px;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

const ago = iso => {
  const m = Math.round((Date.now() - new Date(iso)) / 60000);
  if (m < 1) return 'الآن'; if (m < 60) return `قبل ${m} د`;
  const h = Math.round(m/60); if (h < 24) return `قبل ${h} س`;
  const d = Math.round(h/24); return d === 1 ? 'أمس' : d === 2 ? 'قبل يومين' : d <= 10 ? `قبل ${d} أيام` : `قبل ${d} يوماً`;
};
let toastT;
function toast(msg, type=''){ const t=$('#toast'); t.textContent=msg; t.className=`toast on ${type}`; clearTimeout(toastT); toastT=setTimeout(()=>t.className='toast',3400); }
function errText(e){
  const m = String(e?.message || e || '');
  if (m.includes('FORBIDDEN')) return 'لا تملك صلاحية هذا الإجراء.';
  if (m.includes('BAD_STATE')) return 'حالة الطلب تغيّرت، حدّث الصفحة وحاول مجدداً.';
  if (m.includes('MESSAGE_REQUIRED')) return 'اكتب النص المطلوب.';
  if (/Invalid login/i.test(m)) return 'البريد أو كلمة المرور غير صحيحة.';
  if (/fetch|network/i.test(m)) return 'تعذّر الاتصال. تحقق من الإنترنت.';
  return 'حدث خطأ: ' + m;
}

/* ================= BOOT ================= */
async function boot(){
  if (/type=recovery/.test(location.hash)) { show('vReset'); return; }
  const { data:{ session } } = await sb.auth.getSession();
  if (!session) { show('vLogin'); return; }
  const { data: me, error } = await sb.from('profiles').select('*').eq('id', session.user.id).maybeSingle();
  if (error || !me || !me.active) {
    await sb.auth.signOut(); show('vLogin');
    lMsg('هذا الحساب غير مفعّل في المنصة. تواصل مع مدير النظام.'); return;
  }
  S.me = me;
  const [{ data: cd }, { data: st }, { data: ppl }] = await Promise.all([
    sb.rpc('can_direct'), sb.from('settings').select('*').eq('id',1).maybeSingle(), sb.from('profiles').select('id,full_name,role,title,active,delegate_until,email'),
  ]);
  S.canDirect = !!cd; S.settings = st || {};
  S.people = Object.fromEntries((ppl||[]).map(p => [p.id, p]));
  $('#meName').textContent = me.full_name;
  $('#meRole').textContent = ROLES[me.role] || me.role;
  $('#meDeleg').hidden = !(S.canDirect && me.role !== 'dean');
  $('#btnSettings').hidden = !['admin','dean'].includes(me.role);
  $('#btnReport').hidden = me.role === 'referral';
  $('#secnav').classList.toggle('dean', me.role === 'dean');
  show('vApp'); bumpIdle();
  buildTabs();
  initEnjaz();
  await load();
  setInterval(() => { if (!document.hidden && !$('#mod').classList.contains('on')) load(true); }, CONFIG.AUTO_REFRESH_SEC*1000);
}

async function load(silent){
  if (!silent) $('#list').innerHTML = '<div class="empty"><div class="spin"></div>جاري التحميل…</div>';
  const { data, error } = await sb.from('requests')
    .select('id,ref_no,student_name,university_id,student_email,gender,level,department,college,mobile,category,summary,bypass_reason,bypass_other,justification,status,office_note,dean_decision,dean_note,referred_to,student_message,enjaz_no,assigned_to,forwarded_at,decided_at,decided_by,decided_on_behalf,closed_at,student_replied_at,created_at,updated_at')
    .order('created_at', { ascending:false }).limit(1000);
  if (error) { $('#list').innerHTML = `<div class="empty">${esc(errText(error))}</div>`; return; }
  S.rows = data || [];
  await loadNotes();
  renderKpis(); renderTabs(); renderList(); renderHome(); navBadges();

  const n = prev.length, cnt = n===1 ? 'طلب سابق مشابه' : n===2 ? 'طلبان سابقان مشابهان' : `${n} طلبات سابقة مشابهة`;

const canTake = r => r.status==='new' && ['admin','office'].includes(S.me?.role);

function renderKpis(){

$('#kpis').addEventListener('click', e => {

let TABS = [];
function buildTabs(){
  // كل طلب في تبويب واحد فقط بحسب «ما المطلوب مني؟»، مع «الكل» للعرض الشامل
  TABS = S.me.role === 'dean' ? [

    { id:'done',   l:'التوجيهات الصادرة', f:r => !!r.dean_decision },
    { id:'all',    l:'الكل',               f:() => true },
  ] : [
    { id:'action', l:'تحتاج إجراء', f:r => ['new','in_review'].includes(r.status) || decidedNotClosed(r) },
    { id:'student', l:'لدى الطالب', f:r => r.status==='needs_info' },
    { id:'dean',   l:'لدى العميد',  f:r => r.status==='at_dean' },
    { id:'closed', l:'المكتملة',    f:r => ['closed','withdrawn'].includes(r.status) },
    { id:'all',    l:'الكل',        f:() => true },

}
function renderTabs(){

}

function closeIfHidden(){
  if (S.sel && !filtered().some(r => r.id === S.sel)) { S.sel = null; $('#detail').hidden = true; renderList(); }
}

/* ================= LIST ================= */
function filtered(){
  let rows = S.rows;
  if (S.kpi) rows = rows.filter(KPIS.find(k=>k.id===S.kpi).f);
  else rows = rows.filter(TABS.find(t=>t.id===S.tab).f);
  if (S.q) {
    const q = S.q.replace(/[٠-٩]/g, d => d.charCodeAt(0)-1632).toLowerCase();
    rows = rows.filter(r => [r.student_name, r.university_id, r.ref_no, r.mobile, r.summary, r.enjaz_no, r.college, r.department].some(v => String(v||'').toLowerCase().includes(q)));
  }
  return rows;
}
function renderList(){
  const rows = filtered();
  if (!rows.length) { $('#list').innerHTML = emptyState(); return; }
  $('#list').innerHTML = rows.map(r => `

      ${r.dean_decision ? `<div class="dsum ds-${r.dean_decision}">

async function openReq(id){
  S.sel = id; renderList();

  Object.keys(S.freshNotes).forEach(k => { if (k !== id) delete S.freshNotes[k]; });
  markNotesRead(id);
  renderDetail(r);
}
async function fetchExtras(r){
  const [{ data: files }, { data: events }] = await Promise.all([
    sb.from('request_files').select('*').eq('request_id', r.id).order('created_at'),
    sb.from('request_events').select('*').eq('request_id', r.id).order('created_at'),
  ]);
  const signed = await Promise.all((files||[]).map(async f => {
    const { data } = await sb.storage.from(CONFIG.BUCKET).createSignedUrl(f.path, 3600);
    return { ...f, url: data?.signedUrl };
  }));
  return { files: signed, events: events||[] };
}

};

function wireComposer(r){

function modal(title, body, foot){ $('#modH').textContent = title; $('#modC').innerHTML = body; $('#modF').innerHTML = foot; $('#mod').classList.add('on'); }
function closeModal(){ $('#mod').classList.remove('on'); }
$('#mod').addEventListener('click', e => { if (e.target.id==='mod') closeModal(); });

function confirmBox(title, html, okText){
  return new Promise(res => {
    modal(title, html, `<button class="btn teal" id="mOk">${okText}</button><button class="btn ghost" id="mNo">إلغاء</button>`);
    $('#mOk').onclick = () => { closeModal(); res(true); };

  });

/* «اختيار» العبارات الجاهزة: تُحدَّد وتُلغى بالضغط، وتُحفظ كل عبارة في سطر بنقطة،
   ثم النص الحر، ثم العبارة الختامية (إن وُجدت واختيرت) في آخر سطر */
function splitPicked(value, chips, closing){
  const picked = new Set(); const free = [];
  String(value||'').split('\n').forEach(line => {
    const t = line.trim(); if (!t) return;
    const b = t.replace(/^•\s*/, '');
    if (chips.includes(b)) picked.add(b);
    else if (closing && t === closing) picked.add(closing);
    else free.push(line);
  });
  return { picked, free: free.join('\n') };
}
function composePicked(picked, free, chips, closing){
  const sel = chips.filter(c => picked.has(c));
  const lines = (sel.length + (free.trim() ? 1 : 0) > 1) ? sel.map(c => '• ' + c) : sel;
  if (free.trim()) lines.push(free.trim());
  if (closing && picked.has(closing)) lines.push(closing);
  return lines.join('\n');
}
function formBox(title, fields, okText, submit, okMsg){
  const P = {};
  fields.forEach(f => { if (f.pick) { const sp = splitPicked(f.value, f.chips, f.closing); P[f.id] = sp.picked; f._free = sp.free; } });
  modal(title, fields.map(f => {
    const val = f.pick ? f._free : (f.value||'');
    const chipList = f.pick ? [...f.chips, ...(f.closing ? [f.closing] : [])] : f.chips;
    return `<div><label class="l" for="mf_${f.id}">${f.label}${f.required?' <span style="color:var(--bad)">*</span>':''}</label>
      ${f.pick ? `<div class="picks" data-pick="${f.id}">${chipList.map(c=>`<button type="button" class="pick ${P[f.id].has(c)?'on':''} ${c===f.closing?'closing':''}" data-v="${esc(c)}">${esc(c).replace(/https:\/\/\S+/, '<span class="lnk">🔗 رابط المتابعة</span>')}</button>`).join('')}</div>
        <div class="l" style="margin:10px 0 5px;font-weight:600;color:var(--muted);font-size:12.5px">${f.freeLabel || 'نص إضافي (اختياري)'}</div>` : ''}
      ${f.area ? `<textarea class="textarea" id="mf_${f.id}" ${f.pick?'style="min-height:70px"':''}>${esc(val)}</textarea>` : `<input class="input ${f.ltr?'ltr':''}" id="mf_${f.id}" value="${esc(val)}">`}
      ${!f.pick && f.chips ? `<div class="chips">${f.chips.map(c=>`<button type="button" class="chip" data-for="mf_${f.id}">${esc(c)}</button>`).join('')}</div>` : ''}</div>`;
  }).join(''),
    `<button class="btn pri" id="mOk">${okText}</button><button class="btn ghost" id="mNo">إلغاء</button>`);
  $('#modC').onclick = e => {
    const pk = e.target.closest('.pick');
    if (pk) { const set = P[pk.parentElement.dataset.pick]; const v = pk.dataset.v; set.has(v) ? set.delete(v) : set.add(v); pk.classList.toggle('on', set.has(v)); return; }
    const c = e.target.closest('.chip'); if (!c) return; const t = $('#'+c.dataset.for); t.value = t.value.trim() ? t.value.trim() + '، ' + c.textContent : c.textContent; t.focus();
  };
  $('#mNo').onclick = closeModal;
  $('#mOk').onclick = async () => {
    const v = {};
    for (const f of fields) {
      const raw = $('#mf_'+f.id).value.trim();
      v[f.id] = f.pick ? composePicked(P[f.id], raw, f.chips, f.closing) : raw;
      if (f.required && !v[f.id]) { toast(f.pick ? 'اختر عبارة أو اكتب نصاً' : 'اكتب '+f.label.split('(')[0].trim(), 'error'); return; }
    }
    $('#mOk').disabled = true;
    const ok = await run(() => submit(v), okMsg);
    if (ok) closeModal(); else $('#mOk').disabled = false;
  };
  setTimeout(() => $('#mf_'+fields[0].id)?.focus(), 50);
}

async function signFiles(files){
  if (!files.length) return files;
  try {
    const { data } = await sb.storage.from(CONFIG.BUCKET).createSignedUrls(files.map(f => f.path), LINK_DAYS*86400);
    return files.map((f,i) => ({ ...f, plink: data?.[i]?.signedUrl || f.url }));
  } catch { return files; }
}
function doPrint(){
  const imgs = [...$('#print').querySelectorAll('img')];
  Promise.all(imgs.map(i => i.complete ? 1 : new Promise(res => { i.onload = i.onerror = res; }))).then(() => setTimeout(() => window.print(), 150));
}
async function printForm(r){
  // fresh signed links (valid LINK_DAYS) so attachments are clickable in the saved PDF
  const files = await signFiles(S.cache[r.id]?.files || []);
  $('#print').innerHTML = formHTML(r, files, S.cache[r.id]?.events || []);
  doPrint();
}

/* ================= REPORTS ================= */
const R = { from:null, to:null, preset:'month' };
const hParts = d => { const o = {}; new Intl.DateTimeFormat('en-u-ca-islamic-umalqura-nu-latn',{day:'numeric',month:'numeric',year:'numeric'}).formatToParts(d).forEach(p => o[p.type] = +p.value || o[p.type]); return o; };
const dayStart = d => { const x = new Date(d); x.setHours(0,0,0,0); return x; };
const isoDay = d => { const x = new Date(d); return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`; };
function hijriStart(level){ // level: 'month' | 'year'
  let d = dayStart(new Date());
  for (let i = 0; i < 400; i++) { const h = hParts(d); if (h.day === 1 && (level === 'month' || h.month === 1)) return d; d = new Date(d.getTime() - 864e5); }
  return d;
}
function setPreset(p){
  const today = dayStart(new Date()); R.preset = p;
  if (p === 'month') { R.from = hijriStart('month'); R.to = today; }
  else if (p === 'prev') { const ms = hijriStart('month'); const end = new Date(ms.getTime() - 864e5); let d = end; for (let i=0;i<32;i++){ if (hParts(d).day===1) break; d = new Date(d.getTime()-864e5); } R.from = d; R.to = end; }
  else if (p === 'd90') { R.from = new Date(today.getTime() - 89*864e5); R.to = today; }
  else if (p === 'year') { R.from = hijriStart('year'); R.to = today; }
  else if (p === 'all') { const first = S.rows.reduce((m,r) => Math.min(m, +new Date(r.created_at)), Date.now()); R.from = dayStart(first); R.to = today; }
}
const inRange = r => { const t = new Date(r.created_at); return t >= R.from && t < new Date(R.to.getTime() + 864e5); };
const avgDays = (rows, a, b) => { const v = rows.filter(r => r[a] && r[b]).map(r => (new Date(r[b]) - new Date(r[a])) / 864e5); return v.length ? (v.reduce((x,y)=>x+y,0)/v.length) : null; };
const fmtDays = v => v == null ? '—' : v < 1 ? 'أقل من يوم' : `${v.toFixed(1).replace('.0','')} يوم`;
const pct = (n, d) => d ? Math.round(n*100/d) + '%' : '—';

function rptData(){
  const rows = S.rows.filter(inRange);
  const dec = rows.filter(r => r.dean_decision);
  const count = (arr, key, map) => { const m = {}; arr.forEach(r => { const k = key(r); if (k) m[k] = (m[k]||0) + 1; }); return Object.entries(m).map(([k,v]) => [map ? (map[k]||k) : k, v]).sort((a,b) => b[1]-a[1]); };
  return {
    rows, dec,
    tiles: [
      { l:'إجمالي الطلبات', v: rows.length },
      { l:'صدر فيها توجيه', v: dec.length, s: pct(dec.length, rows.length - rows.filter(r=>r.status==='withdrawn').length) + ' من الطلبات القائمة' },
      { l:'أُقفلت', v: rows.filter(r => r.status==='closed').length },
      { l:'ما زالت مفتوحة', v: rows.filter(r => OPEN.includes(r.status)).length },
      { l:'متوسط المدة حتى التوجيه', v: fmtDays(avgDays(rows,'created_at','decided_at')), small:true },
      { l:'متوسط المدة حتى الإقفال', v: fmtDays(avgDays(rows,'created_at','closed_at')), small:true },
    ],
    decisions: ['approved','rejected','reserved','directed'].map(k => [k, dec.filter(r => r.dean_decision===k).length]),
    byCat: count(rows, r => r.category, CATEGORY),
    byDept: count(rows, r => r.college ? 'من خارج الكلية' : r.department),
    byRef: count(dec, r => r.referred_to),
    byLevel: count(rows, r => `${GENDER[r.gender]||''} · ${LEVEL[r.level]||''}`),
    byBypass: count(rows, r => r.bypass_reason, BYPASS),
    withdrawn: rows.filter(r => r.status==='withdrawn').length,
  };
}
const bars = (title, list, total) => `<div class="rcard"><h4>${title}</h4>${list.length ? list.map(([k,v]) =>
  `<div class="rbar" title="${esc(k)}: ${v}"><span class="k">${esc(k)}</span><span class="tr"><i style="width:${Math.max(3, v*100/Math.max(...list.map(x=>x[1])))}%"></i></span><span class="v">${v}<small> · ${pct(v,total)}</small></span></div>`).join('') : '<div class="rempty">لا توجد بيانات</div>'}</div>`;

        <div class="lg">${d.decisions.map(([k,v]) => `<span><i style="background:${DC[k]}"></i>${k==='directed' ? 'توجيه' : DECISION[k]} <b>${v}</b> <small>(${pct(v,decTotal)})</small></span>`).join('')}</div>` : '<div class="rempty">لم يصدر توجيه في هذه الفترة</div>'}
      </div>
      ${bars('حسب نوع الطلب', d.byCat, d.rows.length)}
      ${bars('حسب القسم', d.byDept, d.rows.length)}
      ${bars('سبب عدم التقديم إلكترونياً', d.byBypass, d.rows.length)}

    </div>
    <div class="rcard wide tblc"><h4>تفاصيل الطلبات <small>(${d.rows.length})</small></h4>
      ${d.rows.length ? `<div class="tw"><table class="rtbl"><thead><tr><th>رقم الطلب</th><th>التاريخ</th><th>الطالب</th><th>النوع</th><th>الحالة</th><th>التوجيه</th><th>الإحالة</th><th>إنجاز</th></tr></thead><tbody>
      ${d.rows.slice().sort((a,b)=>new Date(a.created_at)-new Date(b.created_at)).map(r => `<tr${forPrint?'':` data-open="${r.id}"`}><td class="ltr">${esc(r.ref_no)}</td><td>${hijri(r.created_at)}</td><td>${esc(r.student_name)}</td><td>${CATEGORY[r.category]||''}</td><td>${statusLabel(r)}</td><td>${r.dean_decision ? `<span class="dtx ${r.dean_decision}">${DECISION[r.dean_decision]}</span>` : '—'}</td><td>${esc(r.referred_to||'—')}</td><td class="ltr">${esc(r.enjaz_no||'—')}</td></tr>`).join('')}
      </tbody></table></div>` : '<div class="rempty">لا توجد طلبات في هذه الفترة</div>'}
    </div>`;
}

const ejUuid = () => (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2));
const ICON_MIC = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>';

/* ---------------- تشغيل ---------------- */
function initEnjaz(){
  if (!ejOn()) return;
  $('#btnEnjaz').hidden = false;
  loadEJ(true);
  // سعادة العميد يدخل مباشرة على معاملات إنجاز، وينتقل للطلبات من شريط الأقسام
  if (location.hash === '#enjaz' || ejDean()) openEnjaz(); else setNav();
  addEventListener('hashchange', () => { if (location.hash === '#enjaz' && $('#vEnjaz').hidden) openEnjaz(); });
  setInterval(() => {
    if (document.hidden || $('#mod').classList.contains('on') || E.rec || E.busy) return;
    if (ejDean() && E.open) return;            // لا نغيّر الشاشة والعميد يكتب توجيهه
    loadEJ(true);
  }, CONFIG.AUTO_REFRESH_SEC * 1000);
}
function openEnjaz(){
  $('#vMain').hidden = true; $('#vReport').hidden = true; $('#vEnjaz').hidden = false;
  if (location.hash !== '#enjaz') history.replaceState(null, '', location.pathname + '#enjaz');
  window.scrollTo(0, 0); renderEJ(); loadEJ(true); setNav();
}
function closeEnjaz(){
  ejStopRec(true); E.open = null; E.shell = null;
  $('#vEnjaz').hidden = true; $('#vMain').hidden = false;
  history.replaceState(null, '', location.pathname); setNav();
}
$('#btnEnjaz').onclick = () => openEnjaz();

async function loadEJ(silent){
  const { data: items, error } = await sb.from('enjaz_items').select('*').order('created_at', { ascending:true }).limit(500);
  if (error) { if (!silent) toast(errText(error), 'error'); return; }
  E.items = items || [];
  const ids = E.items.map(i => i.id);
  const { data: files } = ids.length ? await sb.from('enjaz_files').select('*').in('item_id', ids).order('created_at') : { data: [] };
  E.files = files || [];
  const need = E.files.map(f => f.path).filter(p => !E.urls[p]);
  if (need.length) {
    const { data: signed } = await sb.storage.from(EJ_BUCKET).createSignedUrls(need, 6 * 3600);
    (signed || []).forEach(s => { if (s.signedUrl) E.urls[s.path] = s.signedUrl; });
  }
  ejBadge();
  if (!$('#vEnjaz').hidden) renderEJ();
}
function ejBadge(){
  const n = ejDean() ? E.items.filter(i => i.status === 'at_dean').length
                     : E.items.filter(i => i.status === 'directed' || i.status === 'discuss').length;
  const b = $('#ejBadge'); b.hidden = !n; b.textContent = n;
}
function renderEJ(){ if (ejDean()) { E.shell = 'dean'; return ejRenderDean(); } ejRenderOffice(); }

/* ---------------- مكونات مشتركة ---------------- */
function ejPills(i){
  return (i.urgent ? '<span class="pill p-urg">عاجلة</span>' : '') + (i.secret ? '<span class="pill p-sec">سرّي</span>' : '') +
    (i.status === 'at_dean' ? ejAge(i.created_at) : i.status === 'directed' ? '<span class="pill p-dir">وُجّهت</span>'
     : i.status === 'discuss' ? '<span class="pill p-talk">تُناقش مع العميد</span>' : '<span class="pill p-done">نُقلت إلى إنجاز</span>');
}
function ejAttach(i){
  if (i.secret) return `<div class="ej-secret">🔒 معاملة سرّية — المرفق محفوظ في إنجاز برقم <span class="ltr">${esc(i.enjaz_no)}</span></div>`;
  const fs = ejFilesOf(i.id, 'attachment');
  if (!fs.length) return '';
  return `<div class="ej-files">${fs.map(f => `<a class="ej-file" href="${esc(E.urls[f.path] || '#')}" target="_blank" rel="noopener">📄 ${esc(f.name || 'المرفق')}</a>`).join('')}</div>`;
}
function ejDirection(i){
  const v = ejFilesOf(i.id, 'voice').pop();
  if (!i.dean_text && !v && !i.referred_to) return '';
  return `<div class="ej-dir"><span class="lbl">${i.status === 'discuss' ? 'طلب سعادة العميد مناقشتها' : 'توجيه سعادة العميد'}${i.directed_at ? ' · ' + hijri(i.directed_at) + ' ' + time(i.directed_at) : ''}</span>
    ${i.referred_to ? `<div class="tx"><b>يُحال إلى:</b> ${esc(ejRefLabel(i.referred_to))}</div>` : ''}
    ${i.dean_text ? `<div class="tx">${esc(i.dean_text)}</div>` : ''}
    ${v ? `<audio class="ej-audio" controls preload="none" src="${esc(E.urls[v.path] || '')}"></audio>` : ''}</div>`;
}

/* ================= شاشة المكتب (بنفس شكل لوحة الطلبات) ================= */

const EJ_ST = { at_dean:['لدى العميد','t-at_dean'], directed:['صدر التوجيه','dec dec-directed'], discuss:['للمناقشة','t-needs_info'], done:['نُقلت إلى إنجاز','t-closed'] };
const ejStatus = i => `<span class="pill ${EJ_ST[i.status][1]}">${EJ_ST[i.status][0]}</span>`;
E.sel = null; E.q = ''; E.kpi = null; E.shell = null;

function ejFiltered(){
  let rows = E.items.filter(E.kpi ? EJ_KPIS.find(k => k.id === E.kpi).f : EJ_OTABS.find(t => t.id === E.tab).f);
  if (E.q) {
    const q = E.q.replace(/[٠-٩]/g, d => d.charCodeAt(0) - 1632).toLowerCase();
    rows = rows.filter(i => [i.title, i.enjaz_no, i.source, i.summary, i.dean_text].some(v => String(v || '').toLowerCase().includes(q)));
  }
  const t = i => new Date(i.status === 'done' ? (i.done_at || i.updated_at) : i.status === 'at_dean' ? i.created_at : (i.directed_at || i.updated_at));
  return rows.sort((a, b) => a.status === 'at_dean' && b.status === 'at_dean' ? (b.urgent - a.urgent) || (t(a) - t(b))
    : a.status === 'done' || b.status === 'done' ? t(b) - t(a) : t(a) - t(b));
}

$('#vEnjaz').addEventListener('click', async e => {
  const card = e.target.closest('[data-ejsel]');
  if (card && !e.target.closest('a,button')) { E.sel = card.dataset.ejsel; ejPaintList(); return ejPaintDetail(); }
  const b = e.target.closest('button'); if (!b) return;
  if (b.id === 'ejBack' || b.id === 'ejBackD') return closeEnjaz();
  if (b.id === 'ejNew') return ejForm(null);
  if (b.id === 'ejWa') return ejWhatsapp();
  if (b.dataset.ejtab) { E.tab = b.dataset.ejtab; E.kpi = null; return renderEJ(); }
  if (b.dataset.ejk) { E.kpi = E.kpi === b.dataset.ejk ? null : b.dataset.ejk; return renderEJ(); }
  if (b.id === 'ejDClose') { E.sel = null; return renderEJ(); }
  const i = E.items.find(x => x.id === b.dataset.id);
  const a = b.dataset.ej;
  if (a && i) return ejAct(a, i, b);
  if (ejDean()) return ejDeanClick(b);
});

async function ejUpdate(id, patch, okMsg){
  E.busy = true;
  const { error } = await sb.from('enjaz_items').update(patch).eq('id', id);
  E.busy = false;
  if (error) { toast(errText(error), 'error'); return false; }
  toast(okMsg, 'ok'); await loadEJ(true); return true;
}
async function ejAct(a, i, b){
  if (a === 'edit') return ejForm(i);
  if (a === 'copy') {
    try { await navigator.clipboard.writeText(ejDirText(i)); b.textContent = 'نُسخ ✓'; }
    catch { toast('تعذّر النسخ، انسخ النص يدوياً', 'error'); }
    return;
  }
  if (a === 'done') return ejUpdate(i.id, { status:'done', done_at:new Date().toISOString(), done_by:S.me.id }, 'أُقفلت المعاملة ✓');
  if (a === 'reopen') return ejUpdate(i.id, { status: i.directed_at ? 'directed' : 'at_dean', done_at:null, done_by:null }, 'أُعيد فتحها');
  if (a === 'back') {
    const ok = await confirmBox('إعادتها لسعادة العميد', 'تعود المعاملة إلى قائمة «بانتظار توجيهكم» عند سعادة العميد ليوجّه عليها.', 'إعادة');
    if (ok) ejUpdate(i.id, { status:'at_dean', directed_at:null, directed_by:null, notified_at:null }, 'عادت لسعادة العميد');
    return;
  }
  if (a === 'result') {
    modal('نتيجة المناقشة مع سعادة العميد', `<div><label class="l" for="ejRes">التوجيه الذي استقر عليه (يُحفظ مع المعاملة)</label>
      <textarea class="textarea" id="ejRes">${esc(i.dean_text || '')}</textarea></div>`,
      `<button class="btn pri" id="mOk">حفظ وإقفال</button><button class="btn ghost" id="mNo">إلغاء</button>`);
    $('#mNo').onclick = closeModal;
    $('#mOk').onclick = async () => {
      const t = $('#ejRes').value.trim(); if (!t) return toast('اكتب التوجيه', 'error');
      closeModal(); ejUpdate(i.id, { dean_text:t, status:'done', done_at:new Date().toISOString(), done_by:S.me.id }, 'حُفظت النتيجة ✓');
    };
    return;
  }
  if (a === 'del') {
    const ok = await confirmBox('حذف المعاملة', `ستُحذف «${esc(i.title)}» ومرفقاتها من المنصة نهائياً. لا يؤثر هذا على إنجاز.`, 'حذف');
    if (!ok) return;
    const paths = E.files.filter(f => f.item_id === i.id).map(f => f.path);
    if (paths.length) await sb.storage.from(EJ_BUCKET).remove(paths);
    E.busy = true;
    const { error } = await sb.from('enjaz_items').delete().eq('id', i.id);
    E.busy = false;
    if (error) return toast(errText(error), 'error');
    toast('حُذفت', 'ok'); if (E.sel === i.id) E.sel = null; loadEJ(true);
  }
}

/* ---------------- نموذج إضافة / تعديل المعاملة ---------------- */
function ejForm(i){
  const F = { urgent: !!i?.urgent, secret: !!i?.secret, sug: [...(i?.suggestions || [])], files: [], remove: new Set() };
  const existing = i ? ejFilesOf(i.id, 'attachment') : [];
  modal(i ? 'تعديل المعاملة' : 'معاملة جديدة لسعادة العميد', `
    <div class="ej-row2">
      <div><label class="l" for="ejNo">رقم المعاملة في إنجاز</label><input class="input ltr" id="ejNo" value="${esc(i?.enjaz_no || '')}" inputmode="numeric"></div>
      <div><label class="l">الأولوية</label><div class="ej-seg" id="ejPri"><button type="button" data-v="0">عادية</button><button type="button" data-v="1">عاجلة</button></div></div>
    </div>
    <div><label class="l" for="ejTitle">عنوان المعاملة</label><input class="input" id="ejTitle" value="${esc(i?.title || '')}"></div>
    <div><label class="l" for="ejSrc">الجهة الواردة</label><input class="input" id="ejSrc" value="${esc(i?.source || '')}"></div>
    <div><label class="l" for="ejSum">ملخص لسعادة العميد</label><textarea class="textarea" id="ejSum" placeholder="سطران أو ثلاثة تغني عن قراءة الخطاب">${esc(i?.summary || '')}</textarea></div>
    <div><label class="l">المرفق</label><div class="ej-seg" id="ejSec"><button type="button" data-v="0">يُرفع المرفق</button><button type="button" class="sec" data-v="1">سرّي — الملخص فقط</button></div></div>
    <div id="ejFilesBox">
      <label class="ej-pickfile" for="ejFile">اختر الملف (PDF أو صورة أو Word) — حتى ${EJ_MAX_FILES} ملفات، ${EJ_MAX_MB}MB للملف</label>
      <input type="file" id="ejFile" multiple accept=".pdf,.jpg,.jpeg,.png,.webp,.heic,.doc,.docx,application/pdf,image/*" hidden>
      <div class="ej-flist" id="ejFlist"></div>
    </div>
    <div class="ej-secret" id="ejSecNote" hidden>لن يُرفع أي مرفق${existing.length ? '، وستُحذف المرفقات المرفوعة سابقاً' : ''}. يظهر لسعادة العميد أن المرفق محفوظ في إنجاز برقم المعاملة.</div>
    <div><label class="l">التوجيهات المقترحة <span class="hint">— يختار منها سعادة العميد، أو يكتب أو يسجّل غيرها</span></label>
      <div class="ej-sug" id="ejSug"></div>
      <div class="ej-add"><input class="input" id="ejSugIn" placeholder="مثال: يُحال إلى وكيل الكلية للشؤون التعليمية لإكمال اللازم"><button class="btn ghost" type="button" id="ejSugAdd">إضافة</button></div>
    </div>`,
    `<button class="btn pri" id="mOk">${i ? 'حفظ التعديل' : 'حفظ وعرضها على سعادة العميد'}</button><button class="btn ghost" id="mNo">إلغاء</button>`);
  const seg = (id, val) => $$(`#${id} button`).forEach(x => x.classList.toggle('on', x.dataset.v === (val ? '1' : '0')));
  const paint = () => {
    seg('ejPri', F.urgent); seg('ejSec', F.secret);
    $('#ejFilesBox').hidden = F.secret; $('#ejSecNote').hidden = !F.secret;
    $('#ejSug').innerHTML = F.sug.map((s, k) => `<div class="it"><span>${esc(s)}</span><button class="x" type="button" data-k="${k}" aria-label="حذف">×</button></div>`).join('');
    $('#ejFlist').innerHTML = existing.filter(f => !F.remove.has(f.id)).map(f => `<div class="f"><span>📄 ${esc(f.name || 'مرفق')}</span><button class="x btn ghost" type="button" data-rm="${f.id}">إزالة</button></div>`).join('')
      + F.files.map((f, k) => `<div class="f"><span>🆕 ${esc(f.name)}</span><button class="btn ghost" type="button" data-nf="${k}">إزالة</button></div>`).join('');
  };
  paint();
  $('#ejPri').onclick = e => { const b = e.target.closest('button'); if (b) { F.urgent = b.dataset.v === '1'; paint(); } };
  $('#ejSec').onclick = e => { const b = e.target.closest('button'); if (b) { F.secret = b.dataset.v === '1'; paint(); } };
  $('#ejSug').onclick = e => { const b = e.target.closest('[data-k]'); if (b) { F.sug.splice(+b.dataset.k, 1); paint(); } };
  const addSug = () => { const v = $('#ejSugIn').value.trim(); if (!v) return; F.sug.push(v.slice(0, 300)); $('#ejSugIn').value = ''; paint(); $('#ejSugIn').focus(); };
  $('#ejSugAdd').onclick = addSug;
  $('#ejSugIn').onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); addSug(); } };
  $('#ejFlist').onclick = e => {
    const r = e.target.closest('[data-rm]'), n = e.target.closest('[data-nf]');
    if (r) F.remove.add(r.dataset.rm); if (n) F.files.splice(+n.dataset.nf, 1); paint();
  };
  $('#ejFile').onchange = e => {
    for (const f of e.target.files) {
      if (f.size > EJ_MAX_MB * 1048576) { toast(`«${f.name}» أكبر من ${EJ_MAX_MB}MB`, 'error'); continue; }
      if (F.files.length + existing.length - F.remove.size >= EJ_MAX_FILES) { toast(`الحد ${EJ_MAX_FILES} ملفات`, 'error'); break; }
      F.files.push(f);
    }
    e.target.value = ''; paint();
  };
  $('#mNo').onclick = closeModal;
  $('#mOk').onclick = async () => {
    const pending = $('#ejSugIn').value.trim(); if (pending) addSug();
    const row = { enjaz_no: $('#ejNo').value.trim(), title: $('#ejTitle').value.trim(), source: $('#ejSrc').value.trim() || null,
                  summary: $('#ejSum').value.trim() || null, urgent: F.urgent, secret: F.secret, suggestions: F.sug };
    if (!row.enjaz_no) return toast('اكتب رقم المعاملة في إنجاز', 'error');
    if (row.title.length < 3) return toast('اكتب عنوان المعاملة', 'error');
    const btn = $('#mOk'); btn.disabled = true; btn.textContent = 'جاري الحفظ…'; E.busy = true;
    try {
      let id = i?.id;
      if (i) { const { error } = await sb.from('enjaz_items').update(row).eq('id', id); if (error) throw error; }
      else { const { data, error } = await sb.from('enjaz_items').insert(row).select('id').single(); if (error) throw error; id = data.id; }
      const drop = F.secret ? existing : existing.filter(f => F.remove.has(f.id));
      if (drop.length) {
        await sb.storage.from(EJ_BUCKET).remove(drop.map(f => f.path));
        await sb.from('enjaz_files').delete().in('id', drop.map(f => f.id));
      }
      if (!F.secret) for (const f of F.files) {
        const path = `att/${id}/${ejUuid()}.${ejExt(f.name)}`;
        const { error: ue } = await sb.storage.from(EJ_BUCKET).upload(path, f, { contentType: f.type || 'application/octet-stream' });
        if (ue) throw new Error(`تعذّر رفع «${f.name}»: ${ue.message}`);
        const { error: fe } = await sb.from('enjaz_files').insert({ item_id:id, kind:'attachment', path, name:f.name.slice(0, 200), mime:f.type || null, size:f.size });
        if (fe) throw fe;
      }
      closeModal(); toast(i ? 'حُفظ التعديل ✓' : 'حُفظت وعُرضت على سعادة العميد ✓', 'ok');
      E.tab = 'at_dean'; E.kpi = null; E.sel = id; await loadEJ(true);
    } catch (err) {
      console.error(err); toast(errText(err), 'error'); btn.disabled = false; btn.textContent = 'حاول مرة أخرى';
    } finally { E.busy = false; }
  };
}

function ejRefValue(){ return E.ref === 'other' ? (E.refOther || '').trim() : E.ref; }
function ejPhrase(i){
  const p = E.pick; if (p === null || p === 'talk') return '';
  if (p === 'own') return E.own.trim();
  const sug = (i.suggestions || []).filter(x => !EJ_PHRASES.includes(x));
  return p[0] === 's' ? (sug[+p.slice(1)] || '') : (EJ_PHRASES[+p.slice(1)] || '');
}
function ejCanSend(){
  const base = (E.pick !== null && (E.pick !== 'own' || E.own.trim())) || !!E.voice;
  if (E.pick !== 'talk' && E.ref === 'other' && !(E.refOther || '').trim()) return false;
  return base && !(E.ref === 'voice' && !E.voice && E.pick !== 'talk');
}
function ejSync(){
  const b = $('#ejSend'); if (b) b.disabled = !ejCanSend() || !!E.rec;
  const i = E.items.find(x => x.id === E.open), line = $('#ejSumLine'); if (!i || !line) return;
  const talk = E.pick === 'talk';
  $('#ejRefBlk').hidden = talk;
  $('#ejDirBlk').classList.toggle('pulse', E.pick === null && !E.voice);
  $('#ejRefNote').hidden = !(E.ref === 'voice' && !E.voice);
  const other = $('#ejRefOther'); if (other) other.hidden = talk || E.ref !== 'other';
  const rv = ejRefValue();
  const parts = talk ? ['تُناقش معي'] : [rv ? 'يُحال إلى ' + ejRefLabel(rv) : '', ejPhrase(i), E.voice ? '🎙 مع تسجيل صوتي' : ''].filter(Boolean);
  line.innerHTML = parts.length ? `<b>التوجيه:</b> ${parts.map(esc).join(' · ')}` : '';
  line.hidden = !parts.length;
}
function ejPaintMic(){
  const m = $('#ejMic'); if (!m) return;
  if (E.rec) m.innerHTML = `<button class="ej-micbtn rec" id="ejMicBtn" type="button" aria-label="إيقاف التسجيل">${ICON_STOP}</button><span class="lbl" id="ejRecT">0:00 — جاري التسجيل، اضغط للإيقاف</span>`;
  else if (E.voice) m.innerHTML = `<audio class="ej-audio" controls src="${E.voice.url}"></audio><button class="btn line" id="ejRedo" type="button">حذف وإعادة التسجيل</button>`;
  else m.innerHTML = `<button class="ej-micbtn" id="ejMicBtn" type="button" aria-label="بدء التسجيل">${ICON_MIC}</button><span class="lbl">اضغط وتكلّم، ثم اضغط مرة أخرى للإيقاف</span>`;
  ejSync();
}
function ejPickMime(){
  const c = ['audio/webm;codecs=opus', 'audio/mp4', 'audio/aac', 'audio/webm', 'audio/ogg;codecs=opus'];
  return (window.MediaRecorder && MediaRecorder.isTypeSupported) ? (c.find(t => MediaRecorder.isTypeSupported(t)) || '') : '';
}
async function ejStartRec(){
  if (!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) return toast('المتصفح لا يدعم التسجيل الصوتي. حدّث المتصفح أو اكتب التوجيه.', 'error');
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
  catch { return toast('لم يُسمح باستخدام المايك. اسمح للمتصفح باستخدامه من الإعدادات ثم حاول مجدداً.', 'error'); }
  const mime = ejPickMime();
  const rec = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);
  const chunks = [], t0 = Date.now();
  rec.ondataavailable = e => { if (e.data?.size) chunks.push(e.data); };
  rec.onstop = () => {
    stream.getTracks().forEach(t => t.stop());
    clearInterval(E.timer);
    if (E.rec?.discard) { E.rec = null; return; }
    const type = (rec.mimeType || mime || 'audio/webm').split(';')[0];
    const blob = new Blob(chunks, { type });
    const sec = Math.max(1, Math.round((Date.now() - t0) / 1000));
    E.rec = null;
    E.voice = blob.size ? { blob, type, sec, url: URL.createObjectURL(blob) } : null;
    if (!blob.size) toast('لم يُلتقط صوت، حاول مجدداً', 'error');
    ejPaintMic();
  };
  E.rec = { rec, t0 };
  rec.start(1000);
  ejPaintMic();
  E.timer = setInterval(() => {
    const s = Math.floor((Date.now() - t0) / 1000), el = $('#ejRecT');
    if (el) el.textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')} — جاري التسجيل، اضغط للإيقاف`;
    if (s >= EJ_MAX_REC_SEC) ejStopRec();
  }, 500);
}
function ejStopRec(discard){
  if (!E.rec) return;
  if (discard) E.rec.discard = true;
  try { E.rec.rec.stop(); } catch { E.rec = null; }
}
function ejDeanClick(b){
  if (b.dataset.open) { E.open = b.dataset.open; return renderEJ(); }
  if (b.id === 'ejClose') { ejStopRec(true); E.open = null; return renderEJ(); }
  if (b.dataset.r !== undefined) {
    E.ref = E.ref === b.dataset.r ? null : b.dataset.r;
    $$('#ejRefs .ej-pick').forEach(x => x.classList.toggle('on', x.dataset.r === E.ref));
    ejSync();
    if (E.ref === 'other') $('#ejRefOther').focus();
    return;
  }
  if (b.dataset.p !== undefined) {
    $$('#ejPicks .ej-pick').forEach(x => x.classList.toggle('on', x === b));
    E.pick = b.dataset.p;
    const own = $('#ejOwn'); own.hidden = !(E.pick === 'own' || E.pick === 'talk');
    own.placeholder = E.pick === 'talk' ? 'ملاحظة للمكتب (اختياري)' : 'اكتب التوجيه…';
    if (E.pick === 'own') own.focus();
    return ejSync();
  }
  if (b.id === 'ejMicBtn') return E.rec ? ejStopRec() : ejStartRec();
  if (b.id === 'ejRedo') { if (E.voice) URL.revokeObjectURL(E.voice.url); E.voice = null; return ejPaintMic(); }
  if (b.id === 'ejSend') return ejSend(b);
}
$('#vEnjaz').addEventListener('input', e => {
  if (e.target.id === 'ejOwn') { E.own = e.target.value; ejSync(); }
  if (e.target.id === 'ejRefOther') { E.refOther = e.target.value; ejSync(); }
  if (e.target.id === 'ejQ') { E.q = e.target.value.trim(); ejPaintList(); ejPaintDetail(); }
});

/* تحويل التسجيل إلى MP3 أحادي القناة (64kbps) داخل الجهاز */
let ejLamePromise = null;
function ejLoadLame(){
  if (window.lamejs) return Promise.resolve();
  return ejLamePromise ||= new Promise((res, rej) => {
    const sc = document.createElement('script');
    sc.src = 'https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js';
    sc.onload = () => window.lamejs ? res() : rej(new Error('lamejs'));
    sc.onerror = () => { ejLamePromise = null; rej(new Error('lamejs load')); };
    document.head.appendChild(sc);
  });
}
async function ejToMp3(blob){
  await ejLoadLame();
  const AC = window.AudioContext || window.webkitAudioContext;
  const ctx = new AC();
  let buf;
  try {
    const ab = await blob.arrayBuffer();
    buf = await new Promise((res, rej) => { const p = ctx.decodeAudioData(ab, res, rej); if (p && p.then) p.then(res, rej); });
  } finally { try { ctx.close(); } catch {} }
  const rate = buf.sampleRate, n = buf.length, ch = buf.numberOfChannels;
  const mono = new Int16Array(n);
  const chans = Array.from({ length: ch }, (_, k) => buf.getChannelData(k));
  for (let j = 0; j < n; j++) {
    let v = 0; for (let k = 0; k < ch; k++) v += chans[k][j];
    v = Math.max(-1, Math.min(1, v / ch));
    mono[j] = v < 0 ? v * 0x8000 : v * 0x7fff;
  }
  const enc = new lamejs.Mp3Encoder(1, rate, 64), out = [];
  for (let j = 0; j < n; j += 1152) { const d = enc.encodeBuffer(mono.subarray(j, j + 1152)); if (d.length) out.push(new Int8Array(d)); }
  const end = enc.flush(); if (end.length) out.push(new Int8Array(end));
  const mp3 = new Blob(out, { type: 'audio/mpeg' });
  if (mp3.size < 500) throw new Error('empty mp3');
  return mp3;
}
async function ejSend(btn){
  const i = E.items.find(x => x.id === E.open); if (!i || !ejCanSend()) return;
  const discuss = E.pick === 'talk';
  const text = discuss ? E.own.trim() : ejPhrase(i);
  btn.disabled = true; btn.textContent = 'جاري الاعتماد…'; E.busy = true;
  try {
    if (E.voice) {
      // نحوّل التسجيل إلى MP3 ليُسمع في تلقرام وفي الآيفون والأندرويد؛ وإن تعذّر يُرفع كما هو
      let blob = E.voice.blob, type = E.voice.type;
      try { btn.textContent = 'جاري تجهيز التسجيل…'; blob = await ejToMp3(E.voice.blob); type = 'audio/mpeg'; }
      catch (ce) { console.warn('mp3 conversion failed', ce); }
      btn.textContent = 'جاري الاعتماد…';
      const ext = type === 'audio/mpeg' ? 'mp3' : type.includes('mp4') || type.includes('aac') ? 'm4a' : type.includes('ogg') ? 'ogg' : 'webm';
      const path = `voice/${i.id}/${ejUuid()}.${ext}`;
      const { error: ue } = await sb.storage.from(EJ_BUCKET).upload(path, blob, { contentType: type });
      if (ue) throw new Error('تعذّر رفع التسجيل: ' + ue.message);
      const { error: fe } = await sb.from('enjaz_files').insert({ item_id:i.id, kind:'voice', path, name:'توجيه صوتي', mime:type, size:blob.size, duration_s:E.voice.sec });
      if (fe) throw fe;
    }
    const { error } = await sb.rpc('enjaz_direct', { p_id:i.id, p_text:text || null, p_discuss:discuss, p_referred_to:discuss ? null : (ejRefValue() || null) });
    if (error) throw error;
    if (E.voice) URL.revokeObjectURL(E.voice.url);
    E.open = null; E.voice = null; E.pick = null; E.own = ''; E.ref = null; E.refOther = '';
    toast(discuss ? 'وصل لمكتبكم أنكم ترغبون مناقشتها ✓' : 'اعتُمد التوجيه، ووصل لمكتبكم ✓', 'ok');
    await loadEJ(true); renderEJ(); window.scrollTo(0, 0);
  } catch (err) {
    console.error(err);
    const m = String(err?.message || '');
    toast(m.includes('VOICE_REQUIRED') ? 'سجّل الجهة المحال إليها بصوتك أولاً.' : m.includes('NOT_PENDING') ? 'وُجّهت هذه المعاملة من قبل.' : m.includes('NOT_ALLOWED') ? 'التوجيه من حساب سعادة العميد فقط.' : errText(err), 'error');
    btn.disabled = false; btn.textContent = 'اعتماد التوجيه';
  } finally { E.busy = false; }
}

boot();
