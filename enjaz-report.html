<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a1c40">
<meta name="robots" content="noindex,nofollow">
<title>تقرير معاملات إنجاز | مكتب العميد الرقمي</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@600;700;800&display=swap" rel="stylesheet">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}a.start{text-decoration:none}</style>
<style>
/* Layout: one animated slide at a time on the navy stage used by the platform tour; numbers count up and bars grow on entry.
   Deliberately single dark look in the platform identity; every colour set explicitly. */
:root{
  --navy:#12306b; --navy-2:#1d4690; --deep:#0a1c40; --teal:#11908f; --teal-2:#2bb3b1;
  --violet:#8f80ff; --ok:#3fc48a; --warn:#f0b04a; --bad:#ef7d68; --sky:#7fb6ff;
  --on:#eef3fb; --on-2:#a9b8d6; --glass:rgba(255,255,255,.07); --glass-b:rgba(255,255,255,.12);
  --f-head:"Noto Kufi Arabic","IBM Plex Sans Arabic",system-ui,sans-serif; --f-body:"IBM Plex Sans Arabic",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
html{direction:rtl}
body{margin:0;background:var(--deep);color:var(--on);font-family:var(--f-body);-webkit-font-smoothing:antialiased;overflow:hidden}
h1,h2,h3{font-family:var(--f-head);margin:0;line-height:1.45;text-wrap:balance}
button{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.ltr{direction:ltr;unicode-bidi:isolate}

.stage{height:100%;display:flex;flex-direction:column;
  background:radial-gradient(1100px 560px at 88% -12%,rgba(43,179,177,.2),transparent 60%),radial-gradient(900px 520px at -10% 110%,rgba(29,70,144,.55),transparent 60%),var(--deep)}
.topbar{display:flex;align-items:center;gap:12px;padding-block:14px 0;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-head);font-weight:700;font-size:14px}
.brand .mk{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--teal),var(--navy-2));display:grid;place-items:center;font-size:15px}
.brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:11.5px;color:var(--on-2)}
.topbar .sp{flex:1}
.count{font-size:13px;color:var(--on-2);white-space:nowrap}
@media (max-width:600px){.brand small{display:none}.count{font-size:12px}}
.progress{height:3px;margin:12px max(18px,env(safe-area-inset-right,0px)) 0 max(18px,env(safe-area-inset-left,0px));background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--teal-2),var(--teal));transition:width .5s ease;margin-inline-start:auto}

.slides{flex:1;position:relative;min-height:0}
.slide{position:absolute;inset:0;display:grid;place-items:center;padding-block:18px 8px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));opacity:0;visibility:hidden;transition:opacity .45s ease,visibility .45s;overflow-y:auto}
.slide.on{opacity:1;visibility:visible}
.wrap{width:100%;max-width:1060px;margin-block:auto}
.center{text-align:center}
.rv{opacity:0;transform:translateY(16px);transition:opacity .6s ease,transform .6s cubic-bezier(.2,.7,.2,1);transition-delay:var(--d,0s)}
.slide.on .rv{opacity:1;transform:none}

.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--teal-2)}
.eyebrow span{background:rgba(43,179,177,.14);border:1px solid rgba(43,179,177,.35);border-radius:999px;padding:3px 12px}
h2.t{font-size:clamp(24px,3.4vw,36px);margin:10px 0 8px;color:#fff}
p.lead{font-size:clamp(14.5px,1.6vw,17px);line-height:1.95;color:var(--on-2);margin:0 0 22px;max-width:62ch}
.center p.lead{margin-inline:auto}

/* cover */
.cover h1{font-size:clamp(34px,6.4vw,66px);color:#fff}
.cover h1 .gr .w{background:linear-gradient(90deg,var(--teal-2),#8fd9ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.dates{display:inline-flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:14px}
.dates span{background:var(--glass);border:1px solid var(--glass-b);border-radius:999px;padding:5px 14px;font-size:14px}
.verdict{margin:26px auto 0;max-width:640px;display:flex;gap:12px;align-items:center;text-align:right;background:linear-gradient(90deg,rgba(63,196,138,.18),rgba(63,196,138,.06));border:1px solid rgba(63,196,138,.4);border-radius:16px;padding:14px 16px;font-size:16px}
.verdict .ck{width:40px;height:40px;border-radius:50%;background:var(--ok);display:grid;place-items:center;flex:none;font-size:20px;color:#0a1c40;font-weight:800}
.slide.on .verdict .ck{animation:pop .7s .9s both}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
.start{margin-top:28px;display:inline-flex;align-items:center;gap:10px;background:var(--teal);color:#fff;border:0;border-radius:14px;padding:12px 24px;font-weight:700;font-size:16px;cursor:pointer;box-shadow:0 10px 30px rgba(17,144,143,.35)}

/* big numbers */
.tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
@media (max-width:900px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.tiles .tile:last-child{grid-column:1/-1}}
.tile{background:var(--glass);border:1px solid var(--glass-b);border-radius:18px;padding:18px 16px;position:relative;overflow:hidden;text-align:right}
.tile::before{content:"";position:absolute;inset:0 0 auto;height:4px;background:var(--c)}
.tile .ic{font-size:22px}
.tile b{display:block;font-family:var(--f-head);font-size:clamp(34px,4.6vw,50px);color:var(--c);line-height:1.2;margin-top:6px}
.tile b small{font-size:16px;margin-inline-start:4px;color:var(--on-2);font-family:var(--f-body)}
.tile > span{font-weight:700;font-size:14.5px;color:#fff}
.tile em{display:block;font-style:normal;font-size:12.5px;color:var(--on-2)}

/* speed */
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;align-items:center}
@media (max-width:860px){.two{grid-template-columns:1fr;gap:18px}}
.ring{position:relative;width:min(260px,62vw);aspect-ratio:1;margin-inline:auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:14}
.ring .bg{stroke:rgba(255,255,255,.1)}
.ring .fg{stroke:url(#g1);stroke-linecap:round;stroke-dasharray:0 999;transition:stroke-dasharray 1.6s cubic-bezier(.2,.7,.2,1) .3s}
.ring .rin{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .rin b{font-family:var(--f-head);font-size:clamp(40px,6vw,56px);color:#fff;line-height:1}
.ring .rin small{display:block;color:var(--on-2);font-size:13.5px;margin-top:6px}
.stack{display:flex;height:46px;border-radius:12px;overflow:hidden;background:rgba(255,255,255,.08)}
.stack div{display:grid;place-items:center;color:#0a1c40;font-weight:800;font-size:15px;width:0;transition:width 1s cubic-bezier(.2,.7,.2,1);transition-delay:var(--d,0s);overflow:hidden;white-space:nowrap}
.slide.on .stack div{width:var(--w)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13.5px;color:var(--on-2);margin-top:12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:11px;height:11px;border-radius:3px}
.facts{display:grid;gap:10px;margin-top:18px}
.fact{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--glass);border:1px solid var(--glass-b);border-radius:12px;padding:10px 14px;font-size:14.5px}
.fact b{font-family:var(--f-head);font-size:18px;color:#fff}

/* before/after */
.vs{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:18px;align-items:stretch;margin-top:8px}
@media (max-width:760px){.vs{grid-template-columns:1fr}.vs .arrow{transform:rotate(-90deg)!important;justify-self:center;animation:none!important}}
.side{background:var(--glass);border:1px solid var(--glass-b);border-radius:20px;padding:22px 18px;text-align:center}
.side.after{background:linear-gradient(160deg,rgba(63,196,138,.2),rgba(43,179,177,.08));border-color:rgba(63,196,138,.45)}
.side .lb{font-size:14px;color:var(--on-2);font-weight:700}
.side b{display:block;font-family:var(--f-head);font-size:clamp(42px,7vw,72px);line-height:1.15;margin:8px 0 4px;color:#fff}
.side.after b{color:var(--ok)}
.side b small{font-size:clamp(16px,2vw,22px);color:var(--on-2);font-family:var(--f-body);margin-inline-start:6px}
.side p{margin:0;color:var(--on-2);font-size:14px}
.arrow{display:grid;place-items:center;font-size:34px;color:var(--teal-2)}
.slide.on .arrow{animation:nudge 1.4s 1s ease-in-out infinite}
@keyframes nudge{50%{transform:translateX(-8px)}}
.badge{display:inline-flex;gap:8px;align-items:center;margin-top:22px;background:rgba(240,176,74,.14);border:1px solid rgba(240,176,74,.4);color:#ffd99a;border-radius:999px;padding:7px 16px;font-size:14.5px;font-weight:700}

/* daily chart */
.days{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;height:300px;align-items:end;border-bottom:1px solid rgba(255,255,255,.18);padding-top:28px}
@media (max-width:600px){.days{height:240px;gap:6px}}
.day{display:flex;gap:6px;align-items:flex-end;justify-content:center;height:100%}
.col{width:min(34px,40%);border-radius:7px 7px 0 0;height:0;position:relative;transition:height 1s cubic-bezier(.2,.7,.2,1);transition-delay:var(--d,0s)}
.slide.on .col{height:var(--h)}
.col span{position:absolute;top:-24px;left:50%;transform:translateX(-50%);font-weight:800;font-size:14px;color:#fff;opacity:0;transition:opacity .4s;transition-delay:calc(var(--d,0s) + .8s)}
.slide.on .col span{opacity:1}
.col.a{background:linear-gradient(180deg,var(--sky),#3d6fc4)} .col.d{background:linear-gradient(180deg,var(--violet),#5b4bb5)}
.dlab{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-top:8px;text-align:center;font-size:12.5px;color:var(--on-2)}
.dlab b{display:block;color:#fff;font-size:13.5px}
@media (max-width:600px){.dlab{gap:6px;font-size:11px}.dlab b{font-size:11.5px}}

/* bars */
.hbars{display:grid;gap:12px}
.hb{display:grid;grid-template-columns:minmax(130px,230px) minmax(0,1fr) 40px;gap:12px;align-items:center;font-size:14.5px}
@media (max-width:600px){.hb{grid-template-columns:minmax(100px,140px) minmax(0,1fr) 30px;font-size:13px;gap:8px}}
.hb .tr{height:28px;background:rgba(255,255,255,.08);border-radius:9px;overflow:hidden}
.hb .fl{height:100%;width:0;border-radius:9px;background:var(--c);transition:width 1.1s cubic-bezier(.2,.7,.2,1);transition-delay:var(--d,0s)}
.slide.on .hb .fl{width:var(--w)}
.hb .v{font-family:var(--f-head);font-weight:800;font-size:18px;color:#fff;text-align:left}
.foot-note{margin-top:16px;font-size:14px;color:var(--on-2);background:var(--glass);border:1px solid var(--glass-b);border-radius:12px;padding:10px 14px}

.chips{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:26px}
.chip{display:inline-flex;align-items:center;gap:10px;border-radius:14px;padding:10px 16px;font-size:15px;font-weight:700;background:var(--bg);border:1px solid var(--bd);color:#fff}
.chip b{font-family:var(--f-head);font-size:22px;color:var(--fg)}
.chip small{font-weight:500;color:var(--on-2)}

/* insights */
.ins{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:6px;text-align:right}
@media (max-width:860px){.ins{grid-template-columns:1fr}}
.in{background:var(--glass);border:1px solid var(--glass-b);border-radius:18px;padding:18px}
.in .ic{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font-size:22px;background:var(--bg)}
.in b{display:block;font-family:var(--f-head);font-size:16px;color:#fff;margin:10px 0 4px}
.in p{margin:0;color:var(--on-2);font-size:14px;line-height:1.85}
.small-note{margin-top:16px;font-size:13px;color:var(--on-2)}

/* ---------- wavy headings: each word rises in a wave, then a light sweep passes over ---------- */
.w{display:inline-block;transform:translateY(0)}
.slide.on h1 .w,.slide.on h2.t .w{animation:wave 3.6s ease-in-out infinite;animation-delay:calc(var(--i) * .14s + .6s)}
@keyframes wave{0%,60%,100%{transform:translateY(0)}20%{transform:translateY(-7px)}40%{transform:translateY(2px)}}
h2.t .w{background:linear-gradient(100deg,#fff 0%,#fff 38%,#8ff0ec 50%,#fff 62%,#fff 100%);background-size:300% 100%;background-position:100% 0;-webkit-background-clip:text;background-clip:text;color:transparent}
.slide.on h2.t .w{animation:wave 3.6s ease-in-out infinite,sweep 3.6s linear infinite;animation-delay:calc(var(--i) * .14s + .6s),calc(var(--i) * .18s + .3s)}
@keyframes sweep{0%{background-position:100% 0}100%{background-position:-150% 0}}
.slide.on .eyebrow span{animation:glowb 2.4s ease-in-out infinite}
@keyframes glowb{50%{box-shadow:0 0 0 6px rgba(43,179,177,.12),0 0 18px rgba(43,179,177,.35)}}
@media (prefers-reduced-motion:reduce){.w,h2.t .w,.eyebrow span{animation:none!important}}

/* ---------- phones: each slide fits on one screen ---------- */
.slide.fit{overflow:hidden}
@media (max-width:760px){
  .slide{padding-block:10px 4px}
  h2.t{font-size:22px;margin:6px 0 4px}
  p.lead{font-size:13.5px;line-height:1.8;margin-bottom:12px}
  .tile{padding:12px}
  .tile b{font-size:34px}
  .ring{width:min(180px,48vw)}
  .days{height:200px}
  .two{gap:12px}
  .side{padding:14px 12px}
  .side b{font-size:44px}
  .ins{gap:10px}.in{padding:12px}.in b{margin:6px 0 2px}
  .hbars{gap:9px}.hb .tr{height:22px}
}

/* thanks */
.thanks h1{font-size:clamp(48px,9vw,96px);padding-bottom:6px}
.thanks h1 .w{background:linear-gradient(180deg,#fff 30%,#bfe9ea);-webkit-background-clip:text;background-clip:text;color:transparent}
.orn{display:flex;align-items:center;justify-content:center;gap:14px;color:var(--teal-2);margin-bottom:16px}
.orn i{width:70px;height:1px;background:linear-gradient(90deg,transparent,var(--teal-2),transparent)}
.sign{margin-top:20px;display:grid;justify-items:center;gap:6px}
.sign .logo{width:min(220px,58vw);height:auto;margin-bottom:6px;filter:drop-shadow(0 6px 18px rgba(0,0,0,.35))}
.slide.on .sign .logo{animation:logoIn 1s .4s both}
@keyframes logoIn{0%{opacity:0;transform:translateY(10px) scale(.92)}100%{opacity:1;transform:none}}
.sign .ln{width:56px;height:3px;border-radius:3px;background:var(--teal)}
.sign b{font-family:var(--f-head);font-size:clamp(18px,2.4vw,24px);color:#fff}
.sign small{font-size:14px;color:var(--on-2)}

.controls{display:flex;align-items:center;justify-content:center;gap:12px;padding-block:10px calc(14px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.cbtn{width:44px;height:44px;border-radius:13px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.07);display:grid;place-items:center;cursor:pointer;color:#fff}
.cbtn:disabled{opacity:.3;cursor:default}
.cbtn svg{width:20px;height:20px}
.cbtn:focus-visible,.start:focus-visible,.dots button:focus-visible{outline:3px solid var(--teal-2);outline-offset:2px}
.dots{display:flex;gap:6px;align-items:center}
.dots button{width:8px;height:8px;border-radius:50%;border:0;background:rgba(255,255,255,.25);padding:0;cursor:pointer;transition:.25s}
.dots button.on{width:24px;border-radius:5px;background:var(--teal-2)}
@media (prefers-reduced-motion:reduce){.rv,.slide,.col,.hb .fl,.stack div,.ring .fg{transition:none!important}.arrow,.verdict .ck{animation:none!important}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
</head>
<body>
<div class="stage">
  <div class="topbar">
    <div class="brand"><span class="mk">📊</span><div>مكتب العميد الرقمي<small>تقرير معاملات إنجاز</small></div></div>
    <div class="sp"></div>
    <div class="count" id="count"></div>
  </div>
  <div class="progress"><i id="prog"></i></div>
  <div class="slides" id="slides"></div>
  <div class="controls" hidden>
    <button class="cbtn" id="next" type="button" aria-label="التالي"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="m15 18-6-6 6-6"/></svg></button>
    <div class="dots" id="dots"></div>
    <button class="cbtn" id="prev" type="button" aria-label="السابق"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="m9 18 6-6-6-6"/></svg></button>
  </div>
</div>
<script>
/* =====================================================================
   تقرير معاملات إنجاز — صفحة حيّة
   لا تحتوي الصفحة أي بيانات: تُقرأ من قاعدة البيانات بعد التحقق من الدخول،
   ولا يراها إلا من له صلاحية معاملات إنجاز (أسامة وسعادة العميد).
   الرابط: enjaz-report.html?from=YYYY-MM-DD&to=YYYY-MM-DD[&split=YYYY-MM-DD]
   ===================================================================== */

const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const AR = s => String(s).replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const PHRASES = ['لإكمال اللازم وفق ما ينظمه', 'للإفادة بما لديكم ورأيكم', 'للمفاهمة', 'وفق الشرح', 'للعرض'];
const MONTHS = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const WD = ['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
let slides = [], cur = 0, raf = [];

/* ---------- dates (Riyadh, UTC+3, no DST) ---------- */
const RIY = 3 * 3600e3;
const dayKey = iso => new Date(new Date(iso).getTime() + RIY).toISOString().slice(0, 10);
const keyDate = k => new Date(k + 'T00:00:00Z');
const isWork = k => { const d = keyDate(k).getUTCDay(); return d !== 5 && d !== 6; };
const addDay = (k, n = 1) => new Date(keyDate(k).getTime() + n * 864e5).toISOString().slice(0, 10);
function workdaysBetween(a, b){ let n = 0, d = a; while (d < b) { d = addDay(d); if (isWork(d)) n++; } return n; }
const fmtDay = k => { const d = keyDate(k); return `${WD[d.getUTCDay()]} ${AR(d.getUTCDate())} ${MONTHS[d.getUTCMonth()]}`; };
const median = a => { if (!a.length) return 0; const s = [...a].sort((x, y) => x - y), m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
const mean = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : 0;
function dur(h){ // hours → {v,u}
  if (h < 1) return { v: Math.max(1, Math.round(h * 60)), u: 'دقيقة', u3: 'دقائق' };
  if (h < 48) return { v: Math.round(h), u: 'ساعة', u3: 'ساعات' };
  return { v: Math.round(h), u: 'ساعة', u3: 'ساعة' };
}
const unit = d => d.v >= 3 && d.v <= 10 ? d.u3 : d.u;
const normSrc = s => String(s || 'غير محددة').replace(/الفقة/g, 'الفقه').trim();
function countBy(arr, f){ const m = new Map(); arr.forEach(x => { const k = f(x); if (k) m.set(k, (m.get(k) || 0) + 1); }); return [...m.entries()].sort((a, b) => b[1] - a[1]); }

/* ---------- page ---------- */
const params = new URLSearchParams(location.search);
const FROM = params.get('from') || '2026-11-04', TO = params.get('to') || dayKey(new Date().toISOString()), SPLIT = params.get('split');

function message(icon, title, text, btn){
  $('#slides').innerHTML = `<section class="slide on" data-title="${esc(title)}"><div class="wrap center">
    <div style="font-size:46px">${icon}</div><h2 class="t" style="margin-top:6px">${esc(title)}</h2><p class="lead">${text}</p>${btn || ''}</div></section>`;
  $('.controls').hidden = true; $('#count').textContent = '';
}

async function boot(){
  message('⏳', 'جاري تجهيز التقرير', 'لحظات…');
  if (!window.supabase) return message('⚠️', 'تعذّر التحميل', 'تحقق من الاتصال بالإنترنت ثم أعد فتح الرابط.');
  const sb = window.supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession: true, autoRefreshToken: true } });
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return message('🔒', 'التقرير خاص', 'هذا التقرير يظهر لصاحب الصلاحية فقط. سجّل الدخول في «مكتب العميد الرقمي»، وسيعود بك التقرير تلقائياً.',
    `<a class="start" href="admin.html" onclick="try{sessionStorage.setItem('returnTo', location.href)}catch(e){}">تسجيل الدخول</a>`);
  const lo = new Date(keyDate(FROM).getTime() - RIY).toISOString(), hi = new Date(keyDate(addDay(TO)).getTime() - RIY).toISOString();
  const { data: items, error } = await sb.from('enjaz_items').select('*').gte('created_at', lo).lt('created_at', hi).order('created_at').limit(2000);
  if (error) return message('⚠️', 'تعذّر قراءة البيانات', esc(error.message));
  if (!items?.length) return message('🗂️', 'لا توجد بيانات', 'لا توجد معاملات في هذه الفترة، أو أن حسابك لا يملك صلاحية معاملات إنجاز.');
  const ids = items.map(i => i.id);
  const { data: files } = await sb.from('enjaz_files').select('item_id,kind').in('item_id', ids);
  build(items, files || []);
}

/* ---------- stats + slides ---------- */
function build(items, files){
  const voiceSet = new Set(files.filter(f => f.kind === 'voice').map(f => f.item_id));
  const N = items.length, distinct = new Set(items.map(i => i.enjaz_no)).size;
  const dir = items.filter(i => i.directed_at), done = items.filter(i => i.status === 'done');
  const pending = items.filter(i => i.status === 'at_dean').length, toMove = items.filter(i => i.status === 'directed').length, talk = items.filter(i => i.status === 'discuss').length;
  const open = pending + toMove + talk;
  const voiceN = dir.filter(i => voiceSet.has(i.id)).length;
  const H = dir.map(i => (new Date(i.directed_at) - new Date(i.created_at)) / 36e5);
  const closeMin = done.filter(i => i.directed_at && i.done_at).map(i => (new Date(i.done_at) - new Date(i.directed_at)) / 6e4);
  const lag = dir.map(i => workdaysBetween(dayKey(i.created_at), dayKey(i.directed_at)));
  const b0 = lag.filter(x => x === 0).length, b1 = lag.filter(x => x === 1).length, b2 = lag.filter(x => x >= 2).length;
  const within1 = b0 + b1, pct = dir.length ? Math.round(within1 / dir.length * 100) : 0;
  const medH = dur(median(H)), fast = dur(Math.min(...H, 1e9)), cm = Math.round(mean(closeMin));
  const pctTxt = pct >= 90 ? 'أغلب' : pct >= 60 ? 'ثلثا' : pct >= 45 ? 'نصف' : 'جزء من';
  const period = `${fmtDay(FROM)} – ${fmtDay(TO)} ${AR(keyDate(TO).getUTCFullYear())}`;
  const workDays = (() => { const out = []; for (let d = FROM; d <= TO; d = addDay(d)) if (isWork(d)) out.push(d); return out; })();

  // directions
  const phr = new Map();
  dir.forEach(i => {
    const t = (i.dean_text || '').trim();
    const k = !t ? (voiceSet.has(i.id) ? '🎙 بالصوت فقط' : 'دون نص') : PHRASES.includes(t) ? t : 'نص كتبه سعادته';
    phr.set(k, (phr.get(k) || 0) + 1);
  });
  const phrList = [...phr.entries()].sort((a, b) => b[1] - a[1]);
  const voiceWithText = dir.filter(i => voiceSet.has(i.id) && (i.dean_text || '').trim()).length;
  const refs = countBy(dir, i => i.referred_to ? (i.referred_to === 'voice' ? 'موضّحة في التسجيل الصوتي' : i.referred_to) : null);
  const refN = refs.reduce((s, r) => s + r[1], 0);
  const srcs = countBy(items, i => normSrc(i.source));
  const topPhrase = phrList[0];

  // daily
  const addBy = countBy(items, i => dayKey(i.created_at)), dirBy = countBy(dir, i => dayKey(i.directed_at));
  const am = new Map(addBy), dm = new Map(dirBy);
  let days = workDays.filter(d => am.has(d) || dm.has(d));
  if (days.length > 8) days = days.slice(-8);
  const maxDay = Math.max(1, ...days.map(d => Math.max(am.get(d) || 0, dm.get(d) || 0)));
  const peak = [...dm.entries()].sort((a, b) => b[1] - a[1])[0];

  // before / after
  let ba = null;
  if (SPLIT) {
    const A = dir.filter(i => dayKey(i.created_at) < SPLIT), B = dir.filter(i => dayKey(i.created_at) >= SPLIT);
    if (A.length && B.length) {
      const hA = A.map(i => (new Date(i.directed_at) - new Date(i.created_at)) / 36e5), hB = B.map(i => (new Date(i.directed_at) - new Date(i.created_at)) / 36e5);
      const sameB = B.filter(i => dayKey(i.created_at) === dayKey(i.directed_at)).length;
      ba = { a: dur(median(hA)), b: dur(median(hB)), nA: A.length, nB: B.length, sameB, from: fmtDay(dayKey(A[0].created_at)), split: fmtDay(SPLIT) };
    }
  }
  // long waits for insight
  const slow = dir.filter((i, k) => lag[k] >= 2);

  const bar = (label, v, max, c, d) => `<div class="rv hb" style="--d:${d}s;--c:${c};--w:${Math.max(4, Math.round(v / max * 100))}%"><span>${esc(label)}</span><div class="tr"><div class="fl"></div></div><span class="v">${v}</span></div>`;
  const S = [];

  S.push(`<section class="slide cover" data-title="البداية"><div class="wrap center">
    <div class="rv eyebrow"><span>تقرير معاملات إنجاز</span></div>
    <h1 class="rv" style="--d:.1s;margin-top:14px">حصاد معاملات<br><span class="gr">مكتب سعادة العميد</span></h1>
    <div class="rv dates" style="--d:.25s"><span>${period}</span><span>${AR(workDays.length)} أيام عمل</span></div>
    <div class="rv verdict" style="--d:.45s"><span class="ck">${open ? '!' : '✓'}</span><div>${open
      ? `<b>وُجّه ${AR(dir.length)} من ${AR(N)} معاملة، وأُقفلت ${AR(done.length)}.</b> بقي ${AR(open)}: ${[pending ? AR(pending) + ' لدى سعادته' : '', toMove ? AR(toMove) + ' للنقل إلى إنجاز' : '', talk ? AR(talk) + ' للمناقشة' : ''].filter(Boolean).join('، ')}.`
      : `<b>كل ما عُرض على سعادة العميد وُجّه ونُقل إلى إنجاز وأُقفل.</b> لا توجد أي معاملة معلّقة.`}</div></div>
    <button class="rv start" style="--d:.65s" data-go="1" type="button">اعرض الأرقام ←</button></div></section>`);

  S.push(`<section class="slide" data-title="بالأرقام"><div class="wrap">
    <div class="rv eyebrow"><span>الفترة بالأرقام</span></div>
    <h2 class="rv t" style="--d:.08s">${AR(N)} معاملة${open ? `، أُنجز منها ${AR(done.length)}` : '، كلها أُنجزت'}</h2>
    <p class="rv lead" style="--d:.14s">من إضافة المعاملة في المنصة، إلى توجيه سعادة العميد، إلى نقلها لإنجاز وإقفالها.</p>
    <div class="tiles">
      <div class="rv tile" style="--d:.2s;--c:var(--sky)"><span class="ic">📥</span><b class="num" data-count="${N}">0</b><span>عُرضت على سعادته</span><em>معاملة</em></div>
      <div class="rv tile" style="--d:.28s;--c:var(--violet)"><span class="ic">🖋️</span><b class="num" data-count="${dir.length}">0</b><span>وُجّهت</span><em>بنسبة ${AR(Math.round(dir.length / N * 100))}٪</em></div>
      <div class="rv tile" style="--d:.36s;--c:var(--ok)"><span class="ic">✅</span><b class="num" data-count="${done.length}">0</b><span>نُقلت لإنجاز وأُقفلت</span><em>${open ? AR(open) + ' متبقية' : 'صفر معلّق'}</em></div>
      <div class="rv tile" style="--d:.44s;--c:var(--teal-2)"><span class="ic">🎙</span><b class="num" data-count="${voiceN}">0</b><span>فيها صوت سعادته</span><em>من ${AR(dir.length)} توجيهاً</em></div>
      <div class="rv tile" style="--d:.52s;--c:var(--warn)"><span class="ic">⚡</span><b class="num"><span data-count="${cm}">0</span><small>دقيقة</small></b><span>متوسط النقل لإنجاز</span><em>بعد صدور التوجيه</em></div>
    </div></div></section>`);

  if (dir.length) {
    const c = 2 * Math.PI * 86;
    S.push(`<section class="slide" data-title="سرعة التوجيه"><div class="wrap two"><div>
      <div class="rv eyebrow"><span>سرعة التوجيه</span></div>
      <h2 class="rv t" style="--d:.08s">${pctTxt} المعاملات وُجّهت خلال يوم عمل</h2>
      <p class="rv lead" style="--d:.14s">المدة من إضافة المعاملة في المنصة حتى توجيه سعادته، بأيام العمل (الأحد – الخميس).</p>
      <div class="rv" style="--d:.2s"><div class="stack">
        ${b0 ? `<div style="--w:${b0 / dir.length * 100}%;--d:.4s;background:var(--ok)">${b0}</div>` : ''}
        ${b1 ? `<div style="--w:${b1 / dir.length * 100}%;--d:.7s;background:var(--teal-2)">${b1}</div>` : ''}
        ${b2 ? `<div style="--w:${b2 / dir.length * 100}%;--d:1s;background:var(--warn)">${b2}</div>` : ''}</div>
        <div class="legend"><span><i style="background:var(--ok)"></i>نفس اليوم</span><span><i style="background:var(--teal-2)"></i>يوم العمل التالي</span><span><i style="background:var(--warn)"></i>يوما عمل أو أكثر</span></div></div>
      <div class="facts">
        <div class="rv fact" style="--d:.35s"><span>الوسيط من الإضافة حتى التوجيه</span><b class="num"><span data-count="${medH.v}">0</span> ${unit(medH)}</b></div>
        <div class="rv fact" style="--d:.45s"><span>أسرع توجيه</span><b class="num"><span data-count="${fast.v}">0</span> ${unit(fast)}</b></div>
      </div></div>
      <div class="rv" style="--d:.15s"><div class="ring">
        <svg viewBox="0 0 200 200"><defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3fc48a"/><stop offset="1" stop-color="#2bb3b1"/></linearGradient></defs><circle class="bg" cx="100" cy="100" r="86"/><circle class="fg" id="ringFg" data-p="${pct / 100}" cx="100" cy="100" r="86"/></svg>
        <div class="rin"><div><b class="num"><span data-count="${pct}">0</span>٪</b><small>وُجّهت خلال يوم عمل<br>(${AR(within1)} من ${AR(dir.length)})</small></div></div></div></div>
    </div></section>`);
  }

  if (ba) S.push(`<section class="slide" data-title="قبل وبعد"><div class="wrap center">
    <div class="rv eyebrow"><span>الأثر مع الاستخدام</span></div>
    <h2 class="rv t" style="--d:.08s">${ba.b.u === 'دقيقة' && ba.a.u !== 'دقيقة' ? 'من ساعات إلى دقائق' : 'سرعة التوجيه مع الاستخدام'}</h2>
    <p class="rv lead" style="--d:.14s">وسيط الوقت من إضافة المعاملة حتى توجيه سعادته، قبل ${esc(ba.split)} وبعده.</p>
    <div class="vs">
      <div class="rv side" style="--d:.22s"><div class="lb">قبل ${esc(ba.split)}</div><b class="num"><span data-count="${ba.a.v}">0</span><small>${unit(ba.a)}</small></b><p>${AR(ba.nA)} معاملة، والمدة تشمل عطلة نهاية الأسبوع إن وُجدت</p></div>
      <div class="rv arrow" style="--d:.4s">←</div>
      <div class="rv side after" style="--d:.5s"><div class="lb">منذ ${esc(ba.split)}</div><b class="num"><span data-count="${ba.b.v}">0</span><small>${unit(ba.b)}</small></b><p>${AR(ba.nB)} معاملات، ${AR(ba.sameB)} منها وُجّهت في نفس اليوم</p></div>
    </div></div></section>`);

  if (days.length) S.push(`<section class="slide" data-title="الحركة اليومية"><div class="wrap">
    <div class="rv eyebrow"><span>الحركة اليومية</span></div>
    <h2 class="rv t" style="--d:.08s">ما أُضيف وما وُجّه كل يوم</h2>
    <p class="rv lead" style="--d:.14s">${peak ? `أكثر يوم توجيهاً: ${esc(fmtDay(peak[0]))}، وجّه فيه سعادته ${AR(peak[1])} ${peak[1] >= 3 && peak[1] <= 10 ? 'معاملات' : 'معاملة'}.` : ''}</p>
    <div class="rv" style="--d:.2s">
      <div class="days" style="grid-template-columns:repeat(${days.length},minmax(0,1fr))">${days.map((d, k) => {
        const a = am.get(d) || 0, v = dm.get(d) || 0;
        return `<div class="day"><div class="col a" style="--h:${a / maxDay * 100}%;--d:${.3 + k * .1}s">${a ? `<span>${a}</span>` : ''}</div><div class="col d" style="--h:${v / maxDay * 100}%;--d:${.35 + k * .1}s">${v ? `<span>${v}</span>` : ''}</div></div>`; }).join('')}</div>
      <div class="dlab" style="grid-template-columns:repeat(${days.length},minmax(0,1fr))">${days.map(d => { const x = keyDate(d); return `<div><b>${WD[x.getUTCDay()]}</b>${AR(x.getUTCDate())}</div>`; }).join('')}</div>
      <div class="legend" style="justify-content:center;margin-top:14px"><span><i style="background:var(--sky)"></i>أُضيفت</span><span><i style="background:var(--violet)"></i>وُجّهت</span></div>
    </div></div></section>`);

  if (phrList.length) {
    const cs = ['var(--teal-2)', 'var(--sky)', 'var(--violet)', 'var(--warn)', '#9aa7bf', '#9aa7bf', '#9aa7bf'];
    S.push(`<section class="slide" data-title="صيغ التوجيه"><div class="wrap">
      <div class="rv eyebrow"><span>كيف وجّه سعادته؟</span></div>
      <h2 class="rv t" style="--d:.08s">${topPhrase[0].includes('🎙') ? 'الصوت في المقدمة' : 'العبارة الجاهزة أولاً'}</h2>
      <p class="rv lead" style="--d:.14s">صيغة التوجيه المعتمدة على ${AR(dir.length)} توجيهاً.</p>
      <div class="hbars">${phrList.map(([k, v], n) => bar(k, v, phrList[0][1], cs[n] || '#9aa7bf', .2 + n * .1)).join('')}</div>
      ${voiceWithText ? `<div class="rv foot-note" style="--d:.75s">🎙 وأرفق سعادته تسجيلاً صوتياً مع ${AR(voiceWithText)} من التوجيهات المكتوبة أيضاً، فصار مجموع ما فيه صوته <b style="color:#fff">${AR(voiceN)}</b>.</div>` : ''}
    </div></section>`);
  }

  S.push(`<section class="slide" data-title="الإحالة والمصادر"><div class="wrap">
    <div class="rv eyebrow"><span>إلى أين؟ ومن أين؟</span></div>
    <h2 class="rv t" style="--d:.08s">${refs.length ? esc(refs[0][0]) + ' في المقدمة' : 'الجهات الواردة'}</h2>
    <p class="rv lead" style="--d:.14s">${AR(refN)} معاملة حُددت لها جهة إحالة في المنصة، والبقية شرحها سعادته بالصوت أو لم تحتج إحالة.</p>
    ${refs.length ? `<div class="chips">${refs.map(([k, v], n) => `<span class="rv chip" style="--d:${.2 + n * .08}s;--bg:rgba(43,179,177,.12);--bd:rgba(43,179,177,.35);--fg:var(--teal-2)"><b>${v}</b>${esc(k)}</span>`).join('')}</div>` : ''}
    <h3 class="rv" style="--d:.5s;font-size:17px;margin-bottom:12px;color:#fff">🏛️ الجهات الواردة</h3>
    <div class="hbars">${srcs.slice(0, 10).map(([k, v], n) => bar(k, v, srcs[0][1], 'var(--sky)', .55 + n * .06)).join('')}</div>
  </div></section>`);

  const ins = [];
  ins.push(open ? ['📋', 'المتبقي', `${AR(open)} معاملة لم تُقفل بعد في نهاية الفترة.`, 'rgba(240,176,74,.18)']
                : ['🎯', 'لا معلّق', `${AR(N)} معاملة عُرضت، ووُجّهت، ونُقلت إلى إنجاز، وأُقفلت كلها.`, 'rgba(63,196,138,.18)']);
  if (ba) ins.push(['⚡', 'توجيه أسرع', `ما أُضيف منذ ${ba.split} وُجّه بوسيط ${AR(ba.b.v)} ${unit(ba.b)}، بعد أن كان ${AR(ba.a.v)} ${unit(ba.a)} قبله.`, 'rgba(43,179,177,.18)']);
  else ins.push(['⚡', 'سرعة التوجيه', `${AR(pct)}٪ من المعاملات وُجّهت خلال يوم عمل، بوسيط ${AR(medH.v)} ${unit(medH)}.`, 'rgba(43,179,177,.18)']);
  if (slow.length) ins.push(['📌', 'فرصة للتحسين', `${AR(slow.length)} معاملات انتظرت يومي عمل أو أكثر. تذكير قصير بالمعاملة نفسها من زر «تذكير» يختصر هذا الانتظار.`, 'rgba(240,176,74,.18)']);
  else ins.push(['🎙', 'صوت سعادته', `${AR(voiceN)} من ${AR(dir.length)} توجيهاً فيها تسجيل صوتي.`, 'rgba(143,128,255,.18)']);
  S.push(`<section class="slide" data-title="الخلاصة"><div class="wrap center">
    <div class="rv eyebrow"><span>الخلاصة</span></div>
    <h2 class="rv t" style="--d:.08s">${open ? 'ملخص الفترة' : 'فترة ناجحة، وكل المعاملات أُنجزت'}</h2>
    <div class="ins">${ins.map(([ic, t, p, bg], n) => `<div class="rv in" style="--d:${.2 + n * .1}s;--bg:${bg}"><span class="ic">${ic}</span><b>${t}</b><p>${p}</p></div>`).join('')}</div>
    ${distinct < N ? `<div class="rv small-note" style="--d:.6s">بعض المعاملات عُرضت أكثر من مرة، فالـ${AR(N)} تمثل ${AR(distinct)} معاملة مختلفة · الأوقات بتوقيت الرياض</div>` : '<div class="rv small-note" style="--d:.6s">الأوقات بتوقيت الرياض</div>'}
  </div></section>`);

  S.push(`<section class="slide thanks" data-title="شكراً لكم"><div class="wrap center">
    <div class="rv orn" aria-hidden="true"><i></i><span>✦</span><i></i></div>
    <h1 class="rv" style="--d:.12s">شكراً لكم</h1>
    <div class="rv sign" style="--d:.3s"><img class="logo" src="${LOGO}" alt="جامعة القصيم — كلية الشريعة"><span class="ln"></span><b>مكتب عميد كلية الشريعة</b><small>جامعة القصيم</small></div>
    <button class="rv start" style="--d:.5s" data-go="0" type="button">↻ من البداية</button></div></section>`);

  $('#slides').innerHTML = S.join('');
  $('.controls').hidden = false;
  initDeck();
}

/* ---------- deck ---------- */
function countUp(el, to, delay){
  const t0 = performance.now() + delay, d = 1100;
  const step = now => { const p = Math.min(1, Math.max(0, (now - t0) / d)), e = 1 - Math.pow(1 - p, 3); el.textContent = AR(Math.round(to * e)); if (p < 1) raf.push(requestAnimationFrame(step)); };
  if (reduce) { el.textContent = AR(to); return; }
  el.textContent = AR(0); raf.push(requestAnimationFrame(step));
}
function enter(s){
  s.querySelectorAll('[data-count]').forEach((el, k) => countUp(el, +el.dataset.count, 350 + k * 120));
  const ring = s.querySelector('#ringFg');
  if (ring) { const c = 2 * Math.PI * 86, p = +ring.dataset.p; ring.style.strokeDasharray = `0 ${c}`; requestAnimationFrame(() => requestAnimationFrame(() => ring.style.strokeDasharray = `${c * p} ${c}`)); }
}
function fit(){
  const s = slides[cur], w = s && s.querySelector('.wrap'); if (!w) return;
  w.style.zoom = 1; s.classList.remove('fit');
  const cs = getComputedStyle(s), avail = s.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  if (w.scrollHeight > avail && avail > 0) { w.style.zoom = Math.max(.5, (avail - 4) / w.scrollHeight).toFixed(3); s.classList.add('fit'); }
}
function show(i){
  i = Math.max(0, Math.min(slides.length - 1, i));
  raf.forEach(cancelAnimationFrame); raf = [];
  slides.forEach((s, k) => s.classList.toggle('on', k === i));
  slides[i].scrollTop = 0; cur = i;
  $$('#dots button').forEach((b, k) => b.classList.toggle('on', k === i));
  $('#count').innerHTML = `<span class="ltr">${AR(i + 1)} / ${AR(slides.length)}</span> · ${slides[i].dataset.title}`;
  $('#prog').style.width = (i / Math.max(1, slides.length - 1) * 100) + '%';
  $('#prev').disabled = i === 0; $('#next').disabled = i === slides.length - 1;
  enter(slides[i]); requestAnimationFrame(fit);
}
function waveWords(el){
  let i = 0;
  const walk = n => [...n.childNodes].forEach(c => {
    if (c.nodeType === 3) {
      const frag = document.createDocumentFragment();
      c.textContent.split(/(\s+)/).forEach(t => { if (!t) return; if (/^\s+$/.test(t)) frag.append(t); else { const sp = document.createElement('span'); sp.className = 'w'; sp.style.setProperty('--i', i++); sp.textContent = t; frag.append(sp); } });
      c.replaceWith(frag);
    } else if (c.nodeType === 1 && c.tagName !== 'BR') walk(c);
  });
  walk(el);
}
function initDeck(){
  slides = $$('.slide');
  $$('h1, h2.t').forEach(waveWords);
  $('#dots').innerHTML = slides.map((s, i) => `<button type="button" aria-label="${s.dataset.title}" title="${s.dataset.title}" data-i="${i}"></button>`).join('');
  show(0);
}
$('#next').onclick = () => show(cur + 1);
$('#prev').onclick = () => show(cur - 1);
$('#dots').onclick = e => { const b = e.target.closest('[data-i]'); if (b) show(+b.dataset.i); };
document.addEventListener('click', e => { const g = e.target.closest('[data-go]'); if (g) show(+g.dataset.go); });
addEventListener('keydown', e => {
  if (!slides.length) return;
  if (e.key === 'ArrowLeft' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); show(cur + 1); }
  if (e.key === 'ArrowRight' || e.key === 'PageUp') { e.preventDefault(); show(cur - 1); }
});
let tx = null, ty = null;
$('#slides').addEventListener('touchstart', e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
$('#slides').addEventListener('touchend', e => {
  if (tx === null || !slides.length) return; const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.4) show(cur + (dx > 0 ? 1 : -1)); tx = null;
}, { passive: true });
addEventListener('resize', () => requestAnimationFrame(fit));
boot();
</script>
</body>
</html>
